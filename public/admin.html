<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 — 성빈약국</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#F2F4F3; --card:#FFFFFF; --ink:#16201C; --muted:#69736E; --line:#DDE3E0;
    --green:#0E6B4E; --green-soft:#E6F1EC; --green-ink:#0B4A36;
    --amber:#8A5A12; --amber-soft:#FBF1DF;
    --danger:#8C2F24; --danger-soft:#FCEFEC;
    --blue:#1D4E89; --blue-soft:#E8EFF8;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
       font-family:Pretendard Variable,Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       font-size:15px;line-height:1.55}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:30;background:var(--green);color:#fff;padding:10px 18px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700}
  header .sp{flex:1}
  header button{font:inherit;font-size:13px;background:rgba(255,255,255,.16);color:#fff;border:0;
                border-radius:8px;padding:7px 11px;cursor:pointer}
  header button.on{background:#fff;color:var(--green-ink);font-weight:700}
  header .who{font-size:12.5px;opacity:.85}
  main{max-width:1240px;margin:0 auto;padding:16px 18px 80px}
  .cols{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
  @media(max-width:920px){ .cols{grid-template-columns:1fr} }
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
  .box h2{font-size:12px;margin:0 0 10px;color:var(--muted);font-weight:700}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  input,select,textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);
                        border-radius:9px;background:var(--card);color:var(--ink);width:100%}
  textarea{min-height:64px;resize:vertical}
  .btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);
       border-radius:9px;padding:7px 12px;cursor:pointer;width:auto}
  .btn:hover{border-color:var(--green)}
  .btn.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .btn.del{color:var(--danger);border-color:#E7CFCB}
  .btn.sm{font-size:12.5px;padding:5px 9px}
  .list{max-height:66vh;overflow:auto;margin:0 -6px}
  .item{padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .item:hover{background:var(--green-soft)}
  .item.on{background:var(--green-soft);border-color:var(--green)}
  .item .n{font-size:14.5px;font-weight:600}
  .item .s{font-size:12px;color:var(--muted)}
  .warn{color:var(--amber);font-weight:600}
  .bad{color:var(--danger);font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:700px){ .grid2,.grid3{grid-template-columns:1fr} }
  .f label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
  .f{margin-bottom:10px}
  .case-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
  .case-head .t{font-size:15px;font-weight:700}
  .line{border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px}
  .line .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .line .nm{font-size:15px;font-weight:700;flex:1;min-width:120px}
  .role{font-size:11.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
  .r기본{background:var(--green)} .r추가{background:var(--blue)}
  .r대안{background:var(--amber)} .r지명{background:var(--muted)}
  .badge{font-size:11px;border-radius:5px;padding:1px 6px;margin-left:5px}
  .b-o{background:var(--amber-soft);color:var(--amber)} .b-x{background:var(--green-soft);color:var(--green-ink)}
  .empty{color:var(--muted);font-size:14px;padding:8px 0}
  .hint{background:var(--amber-soft);border:1px dashed #E0C79A;border-radius:10px;padding:10px 12px;
        font-size:13.5px;color:var(--amber);margin-bottom:10px}
  .modal-bg{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:50;display:flex;
            align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal{background:var(--card);border-radius:var(--r);padding:18px 20px;max-width:760px;width:100%}
  .modal h3{margin:0 0 14px;font-size:18px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;
         padding:10px 16px;border-radius:10px;font-size:14px;z-index:90}
  .res{border:1px solid var(--line);border-radius:9px;margin-top:6px;max-height:220px;overflow:auto}
  .res div{padding:7px 10px;cursor:pointer;font-size:13.5px}
  .res div:hover{background:var(--green-soft)}
  .login{max-width:360px;margin:14vh auto;background:var(--card);border:1px solid var(--line);
         border-radius:var(--r);padding:24px}
  .login h1{font-size:20px;margin:0 0 4px}.login p{margin:0 0 16px;font-size:14px;color:var(--muted)}
  .login input{margin-bottom:10px}
  .err{color:var(--danger);font-size:13px;min-height:18px}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1>관리자</h1>
  <p>약국 계정으로 로그인하세요.</p>
  <input type="email" id="email" placeholder="이메일" autocomplete="username">
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn go" id="btnLogin" style="width:100%">로그인</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>관리자</h1>
    <button id="tabSym" class="on">증상</button>
    <button id="tabDrug">약 목록</button>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button id="btnLogout">로그아웃</button>
  </header>
  <main>
    <div id="viewSym" class="cols">
      <div class="box">
        <h2>증상</h2>
        <div class="tools">
          <input type="search" id="sq" placeholder="증상·동의어 검색">
          <button class="btn go" id="btnAddSym">+ 증상</button>
        </div>
        <div class="list" id="symList"></div>
      </div>
      <div class="box" id="symPane"><div class="empty">왼쪽에서 증상을 고르세요.</div></div>
    </div>

    <div id="viewDrug" class="cols hidden">
      <div class="box">
        <h2>약 목록 (이름순)</h2>
        <div class="tools">
          <input type="search" id="dq" placeholder="약 이름·성분·증상 검색">
        </div>
        <div class="tools">
          <select id="dfilter">
            <option value="">전체</option>
            <option value="noprice">판매가 없음</option>
            <option value="nosym">증상 없음</option>
            <option value="O">지명품목</option>
            <option value="X">상담품목</option>
          </select>
          <button class="btn go" id="btnAddDrug">+ 약</button>
        </div>
        <div class="list" id="drugList"></div>
      </div>
      <div class="box" id="drugPane"><div class="empty">왼쪽에서 약을 고르세요.</div></div>
    </div>
  </main>
</div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient('https://letwvftkomuxxbhnswyf.supabase.co',
                                 'sb_publishable_Ow_wnycgPkTubzv-sjg96w_by39lUOF');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => n == null ? '' : Number(n).toLocaleString('ko-KR') + '원';
const ROLES = ['기본','추가','대안','지명'];

const S = { uid:null, symptoms:[], items:[], byDrug:{}, sym:null, drug:null, sq:'', dq:'', dfilter:'', view:'sym' };

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function closeModal(){ $('modalRoot').innerHTML = ''; }
function modal(html){
  $('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal">${html}</div></div>`;
}

/* ── 데이터 ── */
async function loadAll(){
  const [flow, cat] = await Promise.all([sb.rpc('flow_all'), sb.rpc('flow_catalog')]);
  S.symptoms = (flow.data && flow.data.symptoms) || [];
  S.items = (cat.data && cat.data.items) || [];
  S.byDrug = {}; S.items.forEach(i => S.byDrug[i.id] = i);
  if(S.sym) S.sym = S.symptoms.find(x => x.id === S.sym.id) || null;
  if(S.drug) S.drug = S.byDrug[S.drug.id] || null;
  renderSymList(); renderSymPane(); renderDrugList(); renderDrugPane();
  lastLoad = Date.now();
}

/* ── 증상 목록 ── */
function symStats(s){
  const cases = s.cases || [];
  const noBase = cases.filter(c => !(c.drugs || []).some(d => d.role === '기본')).length;
  const drugs = cases.reduce((n,c) => n + (c.drugs || []).length, 0);
  return { cases: cases.length, noBase, drugs };
}
function renderSymList(){
  const q = S.sq.trim().toLowerCase();
  const xs = S.symptoms.filter(s => !q
    || s.name.toLowerCase().includes(q) || (s.syn || []).some(x => x.toLowerCase().includes(q)))
    .sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  $('symList').innerHTML = xs.map(s => {
    const st = symStats(s);
    return `<div class="item${S.sym && S.sym.id === s.id ? ' on' : ''}" data-sym="${s.id}">
      <div class="n">${esc(s.name)}</div>
      <div class="s">경우 ${st.cases} · 약 ${st.drugs}
        ${st.noBase ? `<span class="warn">· 기본약 없는 경우 ${st.noBase}</span>` : ''}
        ${!s.ask ? '<span class="warn">· 물어볼 말 없음</span>' : ''}</div>
    </div>`;
  }).join('') || '<div class="empty">없습니다.</div>';
}

/* ── 증상 편집 ── */
function renderSymPane(){
  const s = S.sym;
  if(!s){ $('symPane').innerHTML = '<div class="empty">왼쪽에서 증상을 고르세요.</div>'; return; }
  const cases = [...(s.cases || [])].sort((a,b) => (a.sort - b.sort) || a.label.localeCompare(b.label,'ko'));
  $('symPane').innerHTML = `
    <div class="tools" style="justify-content:space-between">
      <h2 style="margin:0;font-size:17px;color:var(--ink)">${esc(s.name)}</h2>
      <span>
        <button class="btn sm" id="btnEditSym">증상 고치기</button>
        <button class="btn sm go" id="btnAddCase">+ 경우</button>
      </span>
    </div>
    <div class="f"><label>① 물어볼 말</label>
      <div>${s.ask ? esc(s.ask) : '<span class="warn">아직 없습니다 — 「증상 고치기」에서 넣으세요</span>'}</div></div>
    <div class="f"><label>동의어 (환자 말 찾기)</label>
      <div>${(s.syn || []).length ? esc((s.syn || []).join(', ')) : '<span class="warn">없음</span>'}</div></div>
    ${s.red ? `<div class="f"><label>적색기·복약지도</label><div style="white-space:pre-wrap">${esc(s.red)}</div></div>` : ''}
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    ${cases.map(c => caseHtml(c)).join('') || '<div class="empty">경우가 없습니다. 「+ 경우」로 만드세요.</div>'}`;
}
function caseHtml(c){
  const drugs = c.drugs || [];
  const noBase = !drugs.some(d => d.role === '기본');
  return `<div class="case-head">
      <span class="t">${esc(c.label || '(경우 없음 — 바로 추천)')}</span>
      <button class="btn sm" data-rename="${esc(c.label)}">이름·순서</button>
      <button class="btn sm go" data-addline="${esc(c.label)}">+ 약</button>
    </div>
    ${noBase ? '<div class="hint">기본약이 비어 있습니다 — 「+ 약」으로 넣고 역할을 기본으로 두세요.</div>' : ''}
    ${drugs.map(d => lineHtml(d, c)).join('') || '<div class="empty">약이 없습니다.</div>'}`;
}
function lineHtml(d, c){
  const it = S.byDrug[d.drug_id] || {};
  return `<div class="line">
    <div class="top">
      <span class="role r${esc(d.role)}">${esc(d.role)}</span>
      <span class="nm">${esc(d.name)}</span>
      <span style="font-size:13px;color:var(--muted)">${it.price ? won(it.price) : '가격 미정'}</span>
      <button class="btn sm" data-line="${d.line_id}">고치기</button>
      <button class="btn sm del" data-delline="${d.line_id}">빼기</button>
    </div>
    ${d.reason ? `<div style="font-size:13px;color:var(--muted)">${esc(d.reason)}</div>` : ''}
    ${d.alt_when ? `<div style="font-size:13px;color:var(--amber)">대안 조건: ${esc(d.alt_when)}</div>` : ''}
    ${d.role === '기본' && (c.say || c.guide) ? `<div style="font-size:13px;color:var(--green-ink);margin-top:4px">
      ${c.say ? '권하는 말: ' + esc(c.say) : ''}${c.guide ? '<br>복약지도: ' + esc(c.guide) : ''}</div>` : ''}
  </div>`;
}

/* ── 증상 모달 ── */
function openSymModal(s){
  const others = [...S.symptoms].filter(x => !s || x.id !== s.id).sort((a,b) => a.name.localeCompare(b.name,'ko'));
  modal(`<h3>${s ? '증상 고치기' : '새 증상'}</h3>
    <div class="f"><label>증상 이름</label><input id="m_name" value="${esc(s ? s.name : '')}"></div>
    <div class="f"><label>동의어 — 쉼표로 구분 (환자 말에서 이 증상을 찾습니다)</label>
      <input id="m_syn" value="${esc(s ? (s.syn || []).join(', ') : '')}"></div>
    <div class="f"><label>① 물어볼 말 — 약사가 환자에게 하는 질문</label>
      <textarea id="m_ask">${esc(s ? (s.ask || '') : '')}</textarea></div>
    <div class="f"><label>적색기·공통 복약지도</label>
      <textarea id="m_red">${esc(s ? (s.red || '') : '')}</textarea></div>
    ${s ? `<div class="f"><label>다른 증상에 합치기 — 이 증상의 약은 고른 증상 아래 경우 「${esc(s.name)}」로 옮겨집니다</label>
      <select id="m_merge"><option value="">합치지 않음</option>
        ${others.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>` : ''}
    <div class="tools" style="justify-content:flex-end">
      ${s ? '<button class="btn del" id="m_del">증상 삭제</button>' : ''}
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn go" id="m_save">저장</button>
    </div>`);

  async function mergeInto(target, syn){
    const cnt = ((s.cases || []).reduce((n,c) => n + (c.drugs || []).length, 0));
    if(!confirm(`「${s.name}」을(를) 「${target.name}」에 합칠까요?\n\n`
      + `· 약 ${cnt}줄이 「${target.name}」 아래 경우 「${s.name}」로 옮겨집니다\n`
      + `· 동의어가 합쳐지고 「${s.name}」 증상은 없어집니다\n`
      + `· 경우 이름은 나중에 「이름·순서」로 바꿀 수 있습니다`)) return;
    // 모달에서 고친 동의어·문장을 먼저 저장한 뒤 합침
    const pre = await sb.rpc('flow_save_symptom', {
      p_id: s.id, p_name: s.name, p_syn: syn, p_ask: $('m_ask').value, p_red: $('m_red').value });
    if(pre.error){ toast('저장 실패: ' + pre.error.message); return; }
    const { error } = await sb.rpc('flow_merge_symptom', { p_from: s.id, p_into: target.id });
    if(error){ toast('합치기 실패: ' + error.message); return; }
    closeModal(); await loadAll();
    S.sym = S.symptoms.find(x => x.id === target.id) || null;
    renderSymList(); renderSymPane(); toast(`「${target.name}」에 합쳤습니다`);
  }

  $('m_save').onclick = async () => {
    const name = $('m_name').value.trim();
    if(!name){ toast('증상 이름을 넣으세요'); return; }
    const syn = $('m_syn').value.split(',').map(x => x.trim()).filter(Boolean);
    const pickId = s ? $('m_merge').value : '';
    const same = S.symptoms.find(x => x.name === name && (!s || x.id !== s.id));
    if(s && (pickId || same)){
      await mergeInto(pickId ? S.symptoms.find(x => x.id === pickId) : same, syn);
      return;
    }
    if(!s && same){ toast(`「${name}」은(는) 이미 있는 증상입니다`); return; }
    const { data, error } = await sb.rpc('flow_save_symptom', {
      p_id: s ? s.id : null, p_name: name, p_syn: syn, p_ask: $('m_ask').value, p_red: $('m_red').value });
    if(error){ toast('저장 실패: ' + error.message); return; }
    closeModal(); await loadAll();
    S.sym = S.symptoms.find(x => x.id === (s ? s.id : data)) || null;
    renderSymList(); renderSymPane(); toast('저장했습니다');
  };
  if(s) $('m_del').onclick = async () => {
    if(!confirm(`「${s.name}」을 지울까요? 약이 하나라도 걸려 있으면 지워지지 않습니다.`)) return;
    const { data, error } = await sb.rpc('flow_delete_symptom', { p_id: s.id });
    if(error || !data){ toast('약이 걸려 있어 지울 수 없습니다 — 다른 증상에 합치거나 약을 먼저 빼세요'); return; }
    closeModal(); S.sym = null; await loadAll(); toast('지웠습니다');
  };
}

/* ── 약 행 모달 ── */
function openLineModal(line, presetCase, presetDrug){
  const isNew = !line;
  const symOpts = [...S.symptoms].sort((a,b) => a.name.localeCompare(b.name,'ko')).map(x =>
    `<option value="${x.id}" ${(line ? line.sym_id : (S.sym && S.sym.id)) === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  modal(`<h3>${isNew ? '약 넣기' : '약 행 고치기'}</h3>
    ${isNew ? `<div class="f"><label>약 찾기</label>
        <input id="m_drugq" placeholder="약 이름 검색 — 내 약 목록과 나라 약 데이터를 함께 찾습니다">
        <div class="res" id="m_res"></div>
        <div id="m_picked" style="margin-top:6px;font-weight:700"></div></div>`
      : `<div class="f"><label>약</label><div style="font-weight:700">${esc(line.name)}</div></div>`}
    <div class="grid3">
      <div class="f"><label>증상</label><select id="m_sym">${symOpts}</select></div>
      <div class="f"><label>경우</label>
        <select id="m_casesel"></select>
        <input id="m_case" placeholder="새 경우 이름" style="margin-top:6px" class="hidden"></div>
      <div class="f"><label>역할</label><select id="m_role">
        ${ROLES.map(r => `<option ${line && line.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
    </div>
    <div class="grid2">
      <div class="f"><label>권매사유 — 이 약을 권하는 이유</label><input id="m_reason" value="${esc(line ? line.reason : '')}"></div>
      <div class="f"><label>대안 조건 (역할이 대안일 때)</label><input id="m_alt" value="${esc(line ? line.alt_when : '')}"></div>
    </div>
    <div class="f"><label>권하는 말 — 기본약 줄에만 (예: 파미딘정에 쓰리쏙 함께 드리세요)</label>
      <textarea id="m_say">${esc(line ? (line.say || '') : '')}</textarea></div>
    <div class="f"><label>복약지도 — 기본약 줄에만</label>
      <textarea id="m_guide">${esc(line ? (line.guide || '') : '')}</textarea></div>
    <div class="f"><label>순서</label><input id="m_sort" type="number" value="${line ? (line.sort || 1) : 1}" style="max-width:120px"></div>
    <div class="tools" style="justify-content:flex-end">
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn go" id="m_save">저장</button>
    </div>`);
  const curCase = line ? line.case : (presetCase || '');
  function fillCases(){
    const symObj = S.symptoms.find(x => x.id === $('m_sym').value);
    const cases = (symObj && symObj.cases) || [];
    const opts = cases.map(c => `<option value="${esc(c.label)}" ${c.label === curCase ? 'selected' : ''}>`
      + `${esc(c.label || '(경우 없이 바로 추천)')}</option>`).join('');
    const hasCur = cases.some(c => c.label === curCase);
    $('m_casesel').innerHTML = opts
      + (cases.some(c => c.label === '') ? '' : '<option value="">(경우 없이 바로 추천)</option>')
      + `<option value="__new" ${!hasCur && curCase ? 'selected' : ''}>+ 새 경우 만들기</option>`;
    toggleNewCase();
  }
  function toggleNewCase(){
    const isNewCase = $('m_casesel').value === '__new';
    $('m_case').classList.toggle('hidden', !isNewCase);
    if(isNewCase && !$('m_case').value) $('m_case').value = curCase || '';
  }
  function caseValue(){ return $('m_casesel').value === '__new' ? $('m_case').value.trim() : $('m_casesel').value; }
  fillCases();
  $('m_sym').onchange = fillCases;
  $('m_casesel').onchange = toggleNewCase;

  let picked = line ? { id: line.drug_id, name: line.name } : (presetDrug || null);
  if(isNew){
    if(picked) $('m_picked').textContent = '고른 약: ' + picked.name;
    let seq = 0;
    $('m_drugq').oninput = async () => {
      const q = $('m_drugq').value.trim(); const my = ++seq;
      if(q.length < 1){ $('m_res').innerHTML = ''; return; }
      const lq = q.toLowerCase();
      const mine = S.items.filter(i => i.name.toLowerCase().includes(lq) || (i.master || '').toLowerCase().includes(lq)).slice(0, 12);
      const mineHtml = mine.map(i => `<div data-pick="${i.id}"><b>${esc(i.name)}</b>
        <span class="badge b-x">내 목록</span>${i.brand === 'O' ? '<span class="badge b-o">지명</span>' : ''}
        <span style="color:var(--muted)">${i.price ? won(i.price) : '가격 없음'}</span></div>`).join('');
      $('m_res').innerHTML = mineHtml + '<div style="color:var(--muted);padding:6px 10px">나라 약 데이터 찾는 중…</div>';
      if(q.length < 2){ $('m_res').innerHTML = mineHtml; return; }
      const { data } = await sb.from('drugs').select('id,name,company').ilike('name', `%${q}%`).limit(12);
      if(my !== seq) return;
      const have = new Set(S.items.map(i => i.id));
      const natl = (data || []).filter(d => !have.has(d.id));
      $('m_res').innerHTML = mineHtml
        + natl.map(d => `<div data-add="${d.id}" data-name="${esc(d.name)}">${esc(d.name)}
            <span class="badge" style="background:var(--blue-soft);color:var(--blue)">약 DB</span>
            <span style="color:var(--muted)">${esc(d.company || '')}</span></div>`).join('')
        + (mine.length || natl.length ? '' :
           `<div data-new="1" style="color:var(--green-ink)">+ 「${esc(q)}」을(를) 약국 전용 품목으로 등록</div>`);
    };
    $('m_res').onclick = async e => {
      const b = e.target.closest('[data-pick]');
      if(b){
        picked = S.byDrug[b.dataset.pick];
        $('m_picked').textContent = '고른 약: ' + picked.name;
        $('m_res').innerHTML = ''; $('m_drugq').value = ''; return;
      }
      const a = e.target.closest('[data-add]');
      const n = e.target.closest('[data-new]');
      if(!a && !n) return;
      const args = a ? { p_drug_id: a.dataset.add, p_name: a.dataset.name }
                     : { p_drug_id: null, p_name: $('m_drugq').value.trim() };
      const { data, error } = await sb.rpc('catalog_add_drug', args);
      if(error){ toast('약 목록에 넣지 못했습니다: ' + error.message); return; }
      await loadAll();
      picked = S.byDrug[data] || { id: data, name: args.p_name };
      $('m_picked').textContent = '고른 약: ' + picked.name + ' (약 목록에 새로 넣었습니다 — 가격은 약 목록 탭에서)';
      $('m_res').innerHTML = ''; $('m_drugq').value = '';
    };
  }
  $('m_save').onclick = async () => {
    if(!picked){ toast('약을 먼저 고르세요'); return; }
    const role = $('m_role').value;
    if(role === '대안' && !$('m_alt').value.trim()){ toast('대안은 조건을 적어 주세요'); return; }
    const symId = $('m_sym').value;
    const symObj = S.symptoms.find(x => x.id === symId);
    const label = caseValue();
    const known = ((symObj && symObj.cases) || []).find(c => c.label === label);
    const { error } = await sb.rpc('flow_save_line', {
      p_id: line ? line.line_id : null, p_drug_id: picked.id, p_symptom_id: symId,
      p_case: label, p_role: role, p_sort: Number($('m_sort').value) || 1,
      p_case_sort: known ? known.sort : (((symObj && symObj.cases) || []).length + 1) * 10,
      p_reason: $('m_reason').value, p_alt_when: $('m_alt').value,
      p_ask_part: null, p_say: $('m_say').value, p_guide: $('m_guide').value });
    if(error){ toast('저장 실패: ' + error.message); return; }
    closeModal(); await loadAll(); toast('저장했습니다');
  };
}
function findLine(lineId){
  for(const s of S.symptoms) for(const c of (s.cases || [])) for(const d of (c.drugs || []))
    if(d.line_id === lineId)
      return { line_id:d.line_id, drug_id:d.drug_id, name:d.name, role:d.role, reason:d.reason,
               alt_when:d.alt_when, sym_id:s.id, case:c.label,
               say:d.say || '', guide:d.guide || '', sort:d.sort || 1 };
  return null;
}

/* ── 약 목록 ── */
function drugHay(i){
  return [i.name, i.master, i.ing, i.maker, i.supplier,
          ...(i.lines || []).map(l => l.sym + ' ' + l.case + ' ' + l.reason)].join(' ').toLowerCase();
}
function renderDrugList(){
  let xs = S.items;
  if(S.dfilter === 'noprice') xs = xs.filter(i => i.price == null);
  if(S.dfilter === 'nosym') xs = xs.filter(i => !(i.lines || []).length);
  if(S.dfilter === 'O' || S.dfilter === 'X') xs = xs.filter(i => i.brand === S.dfilter);
  const words = S.dq.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(words.length) xs = xs.filter(i => { const h = drugHay(i); return words.every(w => h.includes(w)); });
  $('drugList').innerHTML = xs.map(i => `<div class="item${S.drug && S.drug.id === i.id ? ' on' : ''}" data-drug="${i.id}">
      <div class="n">${esc(i.name)}
        ${i.brand === 'O' ? '<span class="badge b-o">지명</span>' : i.brand === 'X' ? '<span class="badge b-x">상담</span>' : ''}</div>
      <div class="s">${i.price ? won(i.price) : '<span class="warn">판매가 없음</span>'}
        · ${(i.lines || []).length ? '증상 ' + i.lines.length : '<span class="warn">증상 없음</span>'}
        ${i.maker ? '· ' + esc(i.maker) : ''}</div>
    </div>`).join('') || '<div class="empty">없습니다.</div>';
}
function renderDrugPane(){
  const i = S.drug;
  if(!i){ $('drugPane').innerHTML = '<div class="empty">왼쪽에서 약을 고르세요.</div>'; return; }
  const f = (label, id, val, opt) => `<div class="f"><label>${label}</label>${
    opt && opt.area ? `<textarea id="${id}">${esc(val || '')}</textarea>`
    : `<input id="${id}" ${opt && opt.type ? 'type="' + opt.type + '"' : ''} value="${esc(val == null ? '' : val)}">`}</div>`;
  $('drugPane').innerHTML = `
    <div class="tools" style="justify-content:space-between">
      <h2 style="margin:0;font-size:17px;color:var(--ink)">${esc(i.name)}</h2>
      <span><button class="btn sm go" id="btnSaveDrug">저장</button></span>
    </div>
    ${i.master && i.master !== i.name ? `<div class="s" style="color:var(--muted);font-size:12.5px;margin-bottom:8px">약 DB 이름: ${esc(i.master)}</div>` : ''}
    <div class="grid3">
      ${f('판매가', 'd_price', i.price, {type:'number'})}
      ${f('사입가', 'd_cost', i.cost, {type:'number'})}
      ${f('사입처', 'd_supplier', i.supplier)}
    </div>
    <div class="grid2">
      ${f('화면에 보이는 이름', 'd_name', i.name)}
      <div class="f"><label>지명 / 상담</label><select id="d_brand">
        <option value="" ${!i.brand ? 'selected' : ''}>정하지 않음</option>
        <option value="O" ${i.brand === 'O' ? 'selected' : ''}>지명 — 결과에 안 나옴</option>
        <option value="X" ${i.brand === 'X' ? 'selected' : ''}>상담 — 결과에 나옴</option></select></div>
    </div>
    <div class="kv" style="font-size:13px;color:var(--muted);margin-bottom:10px">
      ${i.ing ? `<div><b>성분</b> ${esc(i.ing)}</div>` : ''}
      ${i.maker ? `<div><b>제조사</b> ${esc(i.maker)}${i.spec ? ' · ' + esc(i.spec) : ''}</div>` : ''}
      <div style="margin-top:4px">성분·제조사는 나라 약 데이터에서 읽습니다.</div>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <div class="tools" style="justify-content:space-between">
      <b style="font-size:14px">이 약이 나가는 증상</b>
      <button class="btn sm go" id="btnAddLineForDrug">+ 증상 줄</button>
    </div>
    ${(i.lines || []).map(l => `<div class="line"><div class="top">
        <span class="role r${esc(l.role)}">${esc(l.role)}</span>
        <span class="nm">${esc(l.sym)}${l.case ? ' · ' + esc(l.case) : ''}</span>
        <button class="btn sm" data-line="${l.line_id}">고치기</button>
        <button class="btn sm del" data-delline="${l.line_id}">빼기</button>
      </div>${l.reason ? `<div style="font-size:13px;color:var(--muted)">${esc(l.reason)}</div>` : ''}</div>`).join('')
      || '<div class="empty">아직 없습니다. 지명품목도 증상을 넣어 두면 상담으로 이어집니다.</div>'}`;
  $('btnSaveDrug').onclick = saveDrug;
  $('btnAddLineForDrug').onclick = () => openLineModal(null, '', { id: i.id, name: i.name });
}
async function saveDrug(){
  const i = S.drug;
  const p = {
    name: $('d_name').value.trim(), brand: $('d_brand').value,
    supplier: $('d_supplier').value, price: $('d_price').value, cost: $('d_cost').value
  };
  const { error } = await sb.rpc('flow_save_drug', { p_drug_id: i.id, p });
  if(error){ toast('저장 실패: ' + error.message); return; }
  await loadAll(); toast('저장했습니다');
}

/* ── 약 추가 (약 DB 검색) ── */
function openAddDrugModal(){
  modal(`<h3>약 추가</h3>
    <div class="f"><label>약 DB에서 찾기</label><input id="a_q" placeholder="약 이름 두 글자 이상"></div>
    <div class="res" id="a_res"></div>
    <div class="f" style="margin-top:12px"><label>약 DB에 없으면 — 약국 전용 품목으로 등록</label>
      <input id="a_new" placeholder="품목 이름"></div>
    <div class="tools" style="justify-content:flex-end">
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn go" id="a_add">전용 품목 등록</button>
    </div>`);
  $('a_q').oninput = async () => {
    const q = $('a_q').value.trim(); if(q.length < 2){ $('a_res').innerHTML = ''; return; }
    const { data } = await sb.from('drugs').select('id,name,company').ilike('name', `%${q}%`).limit(20);
    $('a_res').innerHTML = (data || []).map(d => `<div data-add="${d.id}" data-name="${esc(d.name)}">
      ${esc(d.name)} <span style="color:var(--muted)">${esc(d.company || '')}</span></div>`).join('')
      || '<div style="color:var(--muted)">없습니다.</div>';
  };
  $('a_res').onclick = async e => {
    const b = e.target.closest('[data-add]'); if(!b) return;
    const { error } = await sb.rpc('catalog_add_drug', { p_drug_id: b.dataset.add, p_name: b.dataset.name });
    if(error){ toast('추가 실패: ' + error.message); return; }
    closeModal(); await loadAll(); toast('약 목록에 넣었습니다');
  };
  $('a_add').onclick = async () => {
    const name = $('a_new').value.trim(); if(!name){ toast('이름을 넣으세요'); return; }
    const { error } = await sb.rpc('catalog_add_drug', { p_drug_id: null, p_name: name });
    if(error){ toast('등록 실패: ' + error.message); return; }
    closeModal(); await loadAll(); toast('전용 품목으로 등록했습니다');
  };
}

/* ── 이벤트 ── */
$('symList').onclick = e => {
  const b = e.target.closest('[data-sym]'); if(!b) return;
  S.sym = S.symptoms.find(x => x.id === b.dataset.sym) || null;
  renderSymList(); renderSymPane();
};
$('symPane').onclick = async e => {
  const edit = e.target.closest('#btnEditSym'); if(edit){ openSymModal(S.sym); return; }
  const addC = e.target.closest('#btnAddCase'); if(addC){ openLineModal(null, ''); return; }
  const addL = e.target.closest('[data-addline]'); if(addL){ openLineModal(null, addL.dataset.addline); return; }
  const ren = e.target.closest('[data-rename]');
  if(ren){
    const old = ren.dataset.rename;
    const nw = prompt('경우 이름', old); if(nw === null) return;
    const srt = prompt('순서 (숫자가 작을수록 앞)', '10');
    const { error } = await sb.rpc('flow_rename_case', {
      p_symptom_id: S.sym.id, p_old: old, p_new: nw, p_case_sort: Number(srt) || null });
    if(error){ toast('바꾸기 실패: ' + error.message); return; }
    await loadAll(); toast('바꿨습니다'); return;
  }
  const ln = e.target.closest('[data-line]'); if(ln){ openLineModal(findLine(ln.dataset.line)); return; }
  const del = e.target.closest('[data-delline]');
  if(del){
    if(!confirm('이 약을 이 경우에서 뺄까요?')) return;
    const { error } = await sb.rpc('flow_delete_line', { p_id: del.dataset.delline });
    if(error){ toast('실패: ' + error.message); return; }
    await loadAll(); toast('뺐습니다');
  }
};
$('drugList').onclick = e => {
  const b = e.target.closest('[data-drug]'); if(!b) return;
  S.drug = S.byDrug[b.dataset.drug] || null; renderDrugList(); renderDrugPane();
};
$('drugPane').onclick = async e => {
  const ln = e.target.closest('[data-line]'); if(ln){ openLineModal(findLine(ln.dataset.line)); return; }
  const del = e.target.closest('[data-delline]');
  if(del){
    if(!confirm('이 증상 줄을 지울까요?')) return;
    const { error } = await sb.rpc('flow_delete_line', { p_id: del.dataset.delline });
    if(error){ toast('실패: ' + error.message); return; }
    await loadAll(); toast('지웠습니다');
  }
};
$('sq').oninput = e => { S.sq = e.target.value; renderSymList(); };
$('dq').oninput = e => { S.dq = e.target.value; renderDrugList(); };
$('dfilter').onchange = e => { S.dfilter = e.target.value; renderDrugList(); };
$('btnAddSym').onclick = () => openSymModal(null);
$('btnAddDrug').onclick = openAddDrugModal;
/* 다른 탭에 갔다 돌아오면 다시 읽는다 */
let lastLoad = Date.now();
async function refreshIfStale(){
  if(document.hidden || $('app').classList.contains('hidden')) return;
  if(Date.now() - lastLoad < 8000) return;
  if($('modalRoot').innerHTML) return;            // 편집창이 열려 있으면 건드리지 않음
  await loadAll(); lastLoad = Date.now();
}
document.addEventListener('visibilitychange', refreshIfStale);
window.addEventListener('focus', refreshIfStale);
$('tabSym').onclick = () => setView('sym');
$('tabDrug').onclick = () => setView('drug');
function setView(v){
  S.view = v;
  $('viewSym').classList.toggle('hidden', v !== 'sym');
  $('viewDrug').classList.toggle('hidden', v !== 'drug');
  $('tabSym').classList.toggle('on', v === 'sym');
  $('tabDrug').classList.toggle('on', v === 'drug');
}

/* ── 로그인 ── */
function show(w){ $('login').classList.toggle('hidden', w !== 'login'); $('app').classList.toggle('hidden', w !== 'app'); }
$('btnLogin').onclick = async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if(error){ $('loginErr').textContent = '로그인 실패 — 이메일과 비밀번호를 확인하세요.'; return; }
  start();
};
$('pw').onkeydown = e => { if(e.key === 'Enter') $('btnLogin').click(); };
$('btnLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show('login'); return; }
  show('app'); S.uid = session.user.id;
  const { data } = await sb.from('pharmacies').select('name').eq('id', session.user.id).maybeSingle();
  $('who').textContent = (data && data.name) || session.user.email;
  await loadAll();
}
start();
</script>
</body>
</html>
