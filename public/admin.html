<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성빈약국ON · 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#16221f; --ink-soft:#4b5b57; --paper:#f6f4ee; --card:#ffffff;
  --line:#dfe4de; --pine:#1f4d43; --pine-deep:#123329; --pine-tint:#e7efe9;
  --amber:#b8863a; --amber-tint:#f6ecd9; --danger:#a8432f; --danger-tint:#f7e9e4;
  --font-ui: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);}
body{display:flex; justify-content:center;}
#app{width:100%; max-width:640px; min-height:100vh; display:flex; flex-direction:column;}

/* ---- Login ---- */
#loginScreen{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px;
}
.login-card{
  width:100%; max-width:340px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:28px 24px;
}
.login-brand{ font-size:17px; font-weight:800; color:var(--pine-deep); margin-bottom:2px; }
.login-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:20px; }
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
.field input{
  width:100%; font-family:inherit; font-size:14.5px; padding:11px 12px;
  border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--ink);
  outline:none;
}
.field input:focus{ border-color:var(--pine); }
.btn{
  border:none; border-radius:10px; font-family:inherit; font-weight:700; cursor:pointer;
  font-size:14px; padding:11px 16px;
}
.btn-primary{ background:var(--pine); color:#fff; width:100%; margin-top:6px; }
.btn-primary:disabled{ opacity:.5; cursor:default; }
.btn-ghost{ background:var(--card); color:var(--ink-soft); border:1px solid var(--line); }
.btn-danger{ background:var(--danger-tint); color:var(--danger); border:1px solid rgba(168,67,47,.25); }
.btn-sm{ padding:6px 10px; font-size:12px; border-radius:8px; }
.error-msg{ color:var(--danger); font-size:12.5px; margin-top:10px; display:none; }

/* ---- Header ---- */
header.top{
  position:sticky; top:0; z-index:20; background:var(--pine-deep); color:#fff;
  padding:12px 16px 10px;
}
header.top .brandrow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
header.top .brand{ font-size:14.5px; font-weight:700; }
header.top .brand small{ font-weight:400; opacity:.7; font-size:10.5px; margin-left:6px;}
header.top .hdrbtns{ display:flex; gap:6px; }
header.top .hdrbtn{
  background:rgba(255,255,255,.12); border:none; color:#fff; font-family:inherit;
  font-size:11px; padding:6px 9px; border-radius:7px; cursor:pointer;
}
.crumbbar{ display:flex; align-items:center; gap:4px; overflow-x:auto; scrollbar-width:none; }
.crumbbar::-webkit-scrollbar{display:none;}
.crumb{ flex:0 0 auto; font-size:12.5px; color:rgba(255,255,255,.72); white-space:nowrap; padding:3px 2px; border:none; background:none; font-family:inherit; cursor:pointer;}
.crumb.current{ color:#fff; font-weight:700; }
.crumb-sep{ color:rgba(255,255,255,.35); font-size:11px; }

/* ---- Main ---- */
main{ flex:1; padding:14px 16px 60px; }
.hidden{ display:none !important; }

.subheadrow{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.backbtn{ border:1px solid var(--line); background:var(--card); width:32px; height:32px; border-radius:9px; font-size:15px; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.subtitle{ font-size:16.5px; font-weight:800; flex:1; }

.node-row{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:11px 12px; margin-bottom:7px;
}
.node-row .label{ flex:1; font-size:14.5px; font-weight:600; cursor:pointer; min-width:0; word-break:break-word; }
.node-row .miniicon{ background:none; border:none; color:var(--ink-soft); font-size:15px; cursor:pointer; padding:4px 6px; flex:0 0 auto; }
.node-row .miniicon.on{ color:var(--danger); }
.node-row input.rename-input{
  flex:1; font-family:inherit; font-size:14px; padding:7px 9px; border:1px solid var(--pine); border-radius:7px; background:var(--paper); color:var(--ink);
}
.refbadge{ font-size:9.5px; font-weight:700; color:var(--danger); background:var(--danger-tint); border-radius:6px; padding:2px 5px; flex:0 0 auto;}

.addrow{ display:flex; gap:7px; margin:10px 0 18px; }
.addrow input{ flex:1; font-family:inherit; font-size:14px; padding:10px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); }
.addrow button{ flex:0 0 auto; }

.mergebar{
  background:var(--amber-tint); border:1px solid rgba(184,134,58,.3); border-radius:11px;
  padding:11px 13px; margin-bottom:14px; font-size:12.5px; color:var(--amber);
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}

.section-label{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:16px 2px 8px; }

/* ---- Drug cards (leaf editor) ---- */
.drug-edit-card{
  background:var(--card); border:1px solid var(--line); border-left:3px solid var(--pine);
  border-radius:11px; padding:12px 13px; margin-bottom:9px;
}
.drug-edit-card.addon{ border-left-color:var(--amber); }
.drug-edit-card.alt{ border-left-color:var(--ink-soft); }

/* ---- 코치 문장 ---- */
.coach-panel{ background:var(--card); border:1px solid var(--line); border-left:3px solid #1D4E89; border-radius:12px; padding:12px 13px; margin:10px 0 14px; }
.coach-panel summary{ font-size:13px; font-weight:800; cursor:pointer; color:#1D4E89; }
.coach-panel .hint{ font-size:11.5px; color:var(--ink-soft); line-height:1.55; margin:6px 0 10px; }
.coach-panel .mini-field{ margin-bottom:9px; }
.coach-panel .step{ display:inline-block; font-size:10px; font-weight:800; color:#fff; background:#1D4E89; border-radius:5px; padding:1px 5px; margin-right:4px; }
.coach-warn{ background:var(--amber-tint); color:var(--amber); border-radius:9px; padding:8px 10px; font-size:12px; margin-bottom:9px; }
.drug-edit-card .name{ font-size:14.5px; font-weight:700; }
.drug-edit-card .company{ font-size:11px; color:var(--ink-soft); margin-top:1px; margin-bottom:9px;}
.drug-edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.drug-edit-grid .full{ grid-column:1/-1; }
.mini-field label{ display:block; font-size:10.5px; color:var(--ink-soft); margin-bottom:3px; font-weight:600; }
.mini-field input, .mini-field select{
  width:100%; font-family:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--line);
  border-radius:7px; background:var(--paper); color:var(--ink);
}
.drug-edit-actions{ display:flex; gap:7px; margin-top:2px; }

.addDrugBox{ background:var(--pine-tint); border:1px dashed var(--pine); border-radius:12px; padding:13px; margin-top:8px; }
.searchResultItem{
  padding:9px 10px; border:1px solid var(--line); border-radius:8px; margin-top:6px;
  background:var(--card); cursor:pointer; font-size:13px;
}
.searchResultItem b{ font-weight:700; }
.searchResultItem .sub{ font-size:11px; color:var(--ink-soft); }

.toast{
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:var(--pine-deep); color:#fff; font-size:13px; padding:10px 18px;
  border-radius:20px; z-index:99; opacity:0; transition:opacity .2s; pointer-events:none;
}
.toast.show{ opacity:1; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(10,20,16,.5); z-index:90;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  width:100%; max-width:640px; background:var(--paper); border-radius:16px 16px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom)); max-height:80vh; overflow-y:auto;
}
.modal-title{ font-size:15px; font-weight:800; margin-bottom:12px; }

/* ---- 보기 탭 ---- */
.vtabs{ display:flex; gap:4px; margin-bottom:8px; }
.vtab{ flex:1; border:none; background:rgba(255,255,255,.1); color:rgba(255,255,255,.75); font-family:inherit; font-size:13px; font-weight:700; padding:8px 0; border-radius:8px; cursor:pointer; }
.vtab.on{ background:#fff; color:var(--pine-deep); }

/* ---- 약 목록 · 세트 ---- */
.cat-tools{ display:flex; flex-direction:column; gap:7px; margin-bottom:4px; }
.cat-tools input, .cat-input{ width:100%; font-family:inherit; font-size:14.5px; padding:10px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); }
.cat-input{ margin-top:6px; }
.cat-row{ display:flex; gap:7px; align-items:center; }
.cat-row select{ flex:1; min-width:0; font-family:inherit; font-size:13px; padding:8px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink); }
.cat-row .btn{ flex:0 0 auto; width:auto; margin-top:0; white-space:nowrap; }
.cat-item{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:6px; cursor:pointer; }
.cat-item:hover{ border-color:var(--pine); }
.cat-main{ flex:1; min-width:0; }
.cat-name{ font-size:14.5px; font-weight:700; word-break:break-word; }
.cat-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
.cat-price{ flex:0 0 auto; font-size:13.5px; font-weight:700; }
.tag{ display:inline-block; font-size:10px; font-weight:700; border-radius:6px; padding:1px 5px; background:var(--paper); color:var(--ink-soft); vertical-align:middle; }
.tag-o{ background:var(--danger-tint); color:var(--danger); }
.tag-x{ background:var(--pine-tint); color:var(--pine); }
.tag-t{ background:var(--amber-tint); color:var(--amber); }
.tag-warn{ background:var(--amber-tint); color:var(--amber); font-size:11px; }
.mini-field textarea{ width:100%; font-family:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--line); border-radius:7px; background:var(--paper); color:var(--ink); resize:vertical; }
.reason-row{ display:flex; gap:5px; align-items:center; margin-bottom:6px; }
.reason-row input{ min-width:0; font-family:inherit; font-size:13px; padding:7px 8px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--ink); }
.reason-row input[type=number]{ width:46px; flex:0 0 46px; }
.reason-row input[type=text]{ flex:1; }
.set-row{ background:var(--card); border:1px solid var(--line); border-radius:9px; padding:6px 8px; }
.set-nm{ flex:1; font-size:13.5px; font-weight:600; }
.ci-btns{ display:flex; gap:8px; margin-top:10px; }
.ci-btns .btn{ flex:1; margin-top:0; }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="login-card">
      <div class="login-brand">성빈약국ON 관리자</div>
      <div class="login-sub">증상 트리·추천약·가격을 직접 수정하는 전용 화면입니다.</div>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="loginEmail" autocomplete="username" placeholder="goghkdwp@gmail.com">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호">
      </div>
      <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">로그인</button>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>

  <!-- MAIN (after login) -->
  <div id="mainScreen" class="hidden" style="display:flex; flex-direction:column; min-height:100vh;">
    <header class="top">
      <div class="brandrow">
        <div class="brand">성빈약국<small>ON 관리자</small></div>
        <div class="hdrbtns">
          <button class="hdrbtn hidden" id="templateBtn" onclick="doRefreshTemplate()">템플릿 갱신</button>
          <button class="hdrbtn" onclick="openPasswordModal()">비밀번호 변경</button>
          <button class="hdrbtn" onclick="doLogout()">로그아웃</button>
        </div>
      </div>
      <div class="vtabs">
        <button class="vtab on" data-v="tree" onclick="switchView('tree')">증상 트리</button>
        <button class="vtab" data-v="drugs" onclick="switchView('drugs')">약 목록</button>
        <button class="vtab" data-v="sets" onclick="switchView('sets')">세트</button>
      </div>
      <div class="crumbbar" id="crumbbar"></div>
    </header>
    <main>
      <div id="treeAdmin"></div>
      <div id="drugAdmin" class="hidden"></div>
      <div id="setAdmin" class="hidden"></div>
    </main>
  </div>

</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const SUPABASE_URL = "https://letwvftkomuxxbhnswyf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxldHd2ZnRrb211eHhiaG5zd3lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzMyNzYsImV4cCI6MjEwNTA0OTI3Nn0.i_puXrordsKLGyZ71N-8CC8ffrfaOa1BbJRGyWO2bac";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let PHARMACY_ID = null;
let NODES = [];         // pharmacy_taxonomy rows
let LINKS = [];         // taxonomy_drugs rows (with joined drug + price info attached)
let byId = {};
let childrenOf = {};
let linksByTaxonomy = {};
let currentPath = [];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ================= AUTH =================
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = '로그인 중...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = '로그인';
  if(error){
    errEl.textContent = '로그인 실패: ' + error.message;
    errEl.style.display = 'block';
    return;
  }
  PHARMACY_ID = data.user.id;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainScreen').classList.remove('hidden');
  await loadAll();
}

async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}

function openPasswordModal(){
  renderModal(`
    <div class="modal-title">비밀번호 변경</div>
    <div class="field"><label>새 비밀번호 (8자 이상)</label><input type="password" id="newPw"></div>
    <div class="field"><label>새 비밀번호 확인</label><input type="password" id="newPw2"></div>
    <button class="btn btn-primary" onclick="submitPasswordChange()">변경하기</button>
    <button class="btn btn-ghost" style="margin-top:8px;width:100%;" onclick="closeModal()">취소</button>
  `);
}
async function submitPasswordChange(){
  const p1 = document.getElementById('newPw').value;
  const p2 = document.getElementById('newPw2').value;
  if(p1.length < 8){ toast('8자 이상 입력해 주세요'); return; }
  if(p1 !== p2){ toast('비밀번호가 일치하지 않습니다'); return; }
  const { error } = await sb.auth.updateUser({ password: p1 });
  if(error){ toast('변경 실패: ' + error.message); return; }
  toast('비밀번호가 변경되었습니다');
  closeModal();
}

// ================= DATA LOAD =================
async function loadAll(){
  const [taxRes, linkRes, priceRes] = await Promise.all([
    sb.from('pharmacy_taxonomy').select('*').eq('pharmacy_id', PHARMACY_ID),
    sb.from('taxonomy_drugs').select('*, drugs(id,name,company,category,status)'),
    sb.from('pharmacy_drugs').select('drug_id,purchase_price,sale_price').eq('pharmacy_id', PHARMACY_ID)
  ]);
  if(taxRes.error){ toast('노드 로드 실패: '+taxRes.error.message); return; }
  if(linkRes.error){ toast('연결 로드 실패: '+linkRes.error.message); return; }
  NODES = taxRes.data;
  const priceMap = {};
  (priceRes.data||[]).forEach(p => priceMap[p.drug_id] = p);
  LINKS = (linkRes.data||[]).filter(l => byIdRaw(NODES, l.taxonomy_id)).map(l => ({
    id: l.id, taxonomy_id: l.taxonomy_id, tier: l.tier, priority: l.priority, note: l.note,
    is_alt: !!l.is_alt, alt_when: l.alt_when || '',
    drug_id: l.drug_id,
    drug_name: l.drugs ? l.drugs.name : '(삭제된 약)',
    company: l.drugs ? l.drugs.company : null,
    purchase_price: priceMap[l.drug_id] ? priceMap[l.drug_id].purchase_price : null,
    sale_price: priceMap[l.drug_id] ? priceMap[l.drug_id].sale_price : null,
  }));
  rebuildIndexes();
  renderTree();
  checkAdmin();
}
function byIdRaw(arr, id){ return arr.find(n=>n.id===id); }

// ---- 관리자 전용: 템플릿 갱신 ----
async function checkAdmin(){
  const { data } = await sb.from('admins').select('user_id').eq('user_id', PHARMACY_ID).maybeSingle();
  const btn = document.getElementById('templateBtn');
  if(data && btn) btn.classList.remove('hidden');
}
async function doRefreshTemplate(){
  if(!confirm('현재 내 증상 분류 구조를 신규 가입 약국용 템플릿으로 저장할까요?\n(추천약 연결은 저장되지 않습니다)')) return;
  const { data, error } = await sb.rpc('refresh_template');
  if(error){ toast('갱신 실패: ' + error.message); return; }
  toast(`템플릿이 ${data}개 항목으로 갱신되었습니다`);
}

function rebuildIndexes(){
  byId = {}; NODES.forEach(n => byId[n.id]=n);
  childrenOf = {};
  NODES.forEach(n => { const p = n.parent_id || '__root__'; (childrenOf[p]=childrenOf[p]||[]).push(n); });
  Object.values(childrenOf).forEach(list => list.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)));
  linksByTaxonomy = {};
  LINKS.forEach(l => (linksByTaxonomy[l.taxonomy_id]=linksByTaxonomy[l.taxonomy_id]||[]).push(l));
}

// ================= NAV =================
function goTo(nodeId){
  if(nodeId===null){ currentPath = []; }
  else {
    const idx = currentPath.indexOf(nodeId);
    if(idx>=0) currentPath = currentPath.slice(0, idx+1);
    else currentPath.push(nodeId);
  }
  renderTree();
  window.scrollTo(0,0);
}
function goBack(){
  if(currentPath.length<=1){ goTo(null); }
  else { goTo(currentPath[currentPath.length-2]); }
}
function renderCrumbs(){
  const bar = document.getElementById('crumbbar');
  bar.innerHTML = '';
  const home = document.createElement('button');
  home.className = 'crumb' + (currentPath.length===0?' current':'');
  home.textContent = '전체';
  home.onclick = ()=>goTo(null);
  bar.appendChild(home);
  currentPath.forEach((id,i)=>{
    const sep = document.createElement('span'); sep.className='crumb-sep'; sep.textContent='›';
    bar.appendChild(sep);
    const b = document.createElement('button');
    b.className = 'crumb' + (i===currentPath.length-1?' current':'');
    b.textContent = byId[id] ? byId[id].label : '?';
    b.onclick = ()=>goTo(id);
    bar.appendChild(b);
  });
}

// ================= RENDER TREE / NODE LIST =================
function renderTree(){
  renderCrumbs();
  const container = document.getElementById('treeAdmin');
  const curId = currentPath.length ? currentPath[currentPath.length-1] : '__root__';
  const kids = childrenOf[curId] || [];
  const isLeaf = currentPath.length>0 && kids.length===0;

  // 트리가 비어 있으면 템플릿 가져오기 안내
  if(NODES.length === 0){
    container.innerHTML = `
      <div class="addDrugBox" style="text-align:center;padding:24px 16px;">
        <div style="font-size:15px;font-weight:800;margin-bottom:8px;">아직 증상 분류가 없습니다</div>
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;">
          기본 증상 분류 266개를 가져와 바로 시작할 수 있습니다.<br>
          가져온 뒤 자유롭게 수정·삭제하고, 취급하는 제품과 가격을 채워 넣으세요.<br>
          <span style="font-size:11.5px;">추천약은 포함되지 않습니다.</span>
        </div>
        <button class="btn btn-primary" style="width:auto;padding:11px 22px;" onclick="seedTaxonomy(this)">기본 분류 가져오기</button>
      </div>`;
    return;
  }

  let html = '';
  if(currentPath.length>0){
    const node = byId[curId];
    html += `<div class="subheadrow">
      <button class="backbtn" onclick="goBack()">&#8592;</button>
      <div class="subtitle">${escapeHtml(node.label)}</div>
      <button class="miniicon" title="이동" onclick="openMoveModal('${curId}')">&#128257;</button>
      <button class="miniicon" title="병원권유 토글 ${node.suggest_referral?'(켜짐)':''}" onclick="toggleReferral('${curId}')">${node.suggest_referral?'&#128658;':'&#127973;'}</button>
    </div>`;
  } else {
    html += `<div class="section-label">전체 계통 (탭하여 이동)</div>`;
  }

  if(currentPath.length>0 && isCoachNode(curId) && byId[curId].label !== COACH_ROOT){
    html += coachPanelHtml(byId[curId], kids);
  }

  if(isLeaf){
    // auto-merge suggestion at parent level is offered on parent, not leaf itself; leaf shows drug editor
    html += renderDrugEditor(curId);
    container.innerHTML = html;
    return;
  }

  // if current node (non-root) has exactly 1 child and that child is itself a leaf with no sub-children -> offer merge
  if(currentPath.length>0 && kids.length===1 && (childrenOf[kids[0].id]||[]).length===0){
    html += `<div class="mergebar">
      <span>이 항목은 자식이 "${escapeHtml(kids[0].label)}" 하나뿐이고 더 분기되지 않습니다. 생략하고 바로 병합할까요?</span>
      <button class="btn btn-sm btn-primary" style="background:var(--amber);" onclick="mergeOnlyChild('${curId}','${kids[0].id}')">병합</button>
    </div>`;
  }

  html += '<div class="node-list">';
  kids.forEach(k=>{
    html += `<div class="node-row" id="row-${k.id}">
      <span class="label" onclick="goTo('${k.id}')">${escapeHtml(k.label)}</span>
      ${k.suggest_referral ? '<span class="refbadge">병원권유</span>' : ''}
      <button class="miniicon" title="이름변경" onclick="startRename('${k.id}')">&#9998;</button>
      <button class="miniicon" title="이동" onclick="openMoveModal('${k.id}')">&#128257;</button>
      <button class="miniicon on" title="삭제" onclick="deleteNode('${k.id}')">&#128465;</button>
    </div>`;
  });
  html += '</div>';
  html += `<div class="addrow">
    <input type="text" id="newNodeInput" placeholder="새 항목 이름 입력">
    <button class="btn btn-primary btn-sm" onclick="addChildNode('${currentPath.length?curId:'__root__'}')">+ 추가</button>
  </div>`;

  container.innerHTML = html;
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- 기본 분류(템플릿) 가져오기 ----
async function seedTaxonomy(btn){
  if(btn){ btn.disabled = true; btn.textContent = '가져오는 중...'; }
  const { data, error } = await sb.rpc('seed_my_taxonomy');
  if(error){
    toast('가져오기 실패: ' + error.message);
    if(btn){ btn.disabled = false; btn.textContent = '기본 분류 가져오기'; }
    return;
  }
  toast(`${data}개 항목을 가져왔습니다`);
  currentPath = [];
  await loadAll();
}

// ---- rename ----
function startRename(nodeId){
  const row = document.getElementById('row-'+nodeId);
  const node = byId[nodeId];
  row.innerHTML = `
    <input class="rename-input" id="renameInput-${nodeId}" value="${escapeHtml(node.label)}">
    <button class="miniicon" title="저장" onclick="submitRename('${nodeId}')">&#9989;</button>
    <button class="miniicon" title="취소" onclick="renderTree()">&#10060;</button>
  `;
  document.getElementById('renameInput-'+nodeId).focus();
}
async function submitRename(nodeId){
  const val = document.getElementById('renameInput-'+nodeId).value.trim();
  if(!val){ toast('이름을 입력해 주세요'); return; }
  const { error } = await sb.from('pharmacy_taxonomy').update({label:val}).eq('id', nodeId);
  if(error){ toast('저장 실패: '+error.message); return; }
  byId[nodeId].label = val;
  toast('이름이 변경되었습니다');
  renderTree();
}

// ---- add child ----
async function addChildNode(parentIdRaw){
  const input = document.getElementById('newNodeInput');
  const label = input.value.trim();
  if(!label){ toast('이름을 입력해 주세요'); return; }
  const parent_id = parentIdRaw === '__root__' ? null : parentIdRaw;
  const siblings = childrenOf[parentIdRaw] || [];
  const sort_order = siblings.length ? Math.max(...siblings.map(s=>s.sort_order||0)) + 1 : 1;
  const { data, error } = await sb.from('pharmacy_taxonomy')
    .insert({ pharmacy_id: PHARMACY_ID, parent_id, label, sort_order, suggest_referral:false })
    .select().single();
  if(error){ toast('추가 실패: '+error.message); return; }
  NODES.push(data);
  rebuildIndexes();
  toast('추가되었습니다');
  renderTree();
}

// ---- delete ----
async function deleteNode(nodeId){
  const hasKids = (childrenOf[nodeId]||[]).length>0;
  const hasDrugs = (linksByTaxonomy[nodeId]||[]).length>0;
  if(hasKids || hasDrugs){
    if(!confirm('이 항목에는 하위 항목 또는 연결된 약이 있습니다. 정말 삭제하시겠습니까?\n(하위 항목·약 연결도 함께 삭제될 수 있습니다)')) return;
  } else {
    if(!confirm('이 항목을 삭제하시겠습니까?')) return;
  }
  const { error } = await sb.from('pharmacy_taxonomy').delete().eq('id', nodeId);
  if(error){ toast('삭제 실패: '+error.message); return; }
  NODES = NODES.filter(n=>n.id!==nodeId);
  LINKS = LINKS.filter(l=>l.taxonomy_id!==nodeId);
  rebuildIndexes();
  toast('삭제되었습니다');
  renderTree();
}

// ---- referral toggle ----
async function toggleReferral(nodeId){
  const node = byId[nodeId];
  const next = !node.suggest_referral;
  const { error } = await sb.from('pharmacy_taxonomy').update({suggest_referral:next}).eq('id', nodeId);
  if(error){ toast('변경 실패: '+error.message); return; }
  node.suggest_referral = next;
  toast(next ? '병원권유로 표시했습니다' : '병원권유 표시를 해제했습니다');
  renderTree();
}

// ---- merge single-child pass-through ----
async function mergeOnlyChild(parentId, childId){
  if(!confirm('분기 없는 하위 항목을 생략하고, 그 약 연결을 이 항목으로 합칠까요?')) return;
  const { error: e1 } = await sb.from('taxonomy_drugs').update({taxonomy_id:parentId}).eq('taxonomy_id', childId);
  if(e1){ toast('병합 실패: '+e1.message); return; }
  const { error: e2 } = await sb.from('pharmacy_taxonomy').delete().eq('id', childId);
  if(e2){ toast('병합 실패(삭제 단계): '+e2.message); return; }
  LINKS.forEach(l => { if(l.taxonomy_id===childId) l.taxonomy_id = parentId; });
  NODES = NODES.filter(n=>n.id!==childId);
  rebuildIndexes();
  toast('병합되었습니다');
  renderTree();
}

// ---- move / reparent ----
function openMoveModal(nodeId){
  const descendants = getDescendantIds(nodeId);
  const excluded = new Set([nodeId, ...descendants]);
  const options = NODES.filter(n => !excluded.has(n.id));
  let listHtml = `<div class="searchResultItem" onclick="submitMove('${nodeId}', null)"><b>전체 (최상위 계통으로)</b></div>`;
  options.sort((a,b)=>a.label.localeCompare(b.label,'ko')).forEach(n=>{
    listHtml += `<div class="searchResultItem" onclick="submitMove('${nodeId}','${n.id}')"><b>${escapeHtml(n.label)}</b><div class="sub">${pathLabel(n.id)}</div></div>`;
  });
  renderModal(`
    <div class="modal-title">"${escapeHtml(byId[nodeId].label)}" 이동할 위치 선택</div>
    <input type="text" placeholder="검색..." oninput="filterMoveList(this.value)" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:8px;">
    <div id="moveList">${listHtml}</div>
  `);
}
function pathLabel(nodeId){
  const chain = [];
  let cur = byId[nodeId];
  while(cur){ chain.unshift(cur.label); cur = cur.parent_id ? byId[cur.parent_id] : null; }
  return chain.join(' › ');
}
function filterMoveList(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#moveList .searchResultItem').forEach(el=>{
    el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}
function getDescendantIds(nodeId){
  const out = [];
  const stack = [...(childrenOf[nodeId]||[])];
  while(stack.length){
    const n = stack.pop();
    out.push(n.id);
    (childrenOf[n.id]||[]).forEach(c=>stack.push(c));
  }
  return out;
}
async function submitMove(nodeId, newParentId){
  const { error } = await sb.from('pharmacy_taxonomy').update({parent_id:newParentId}).eq('id', nodeId);
  if(error){ toast('이동 실패: '+error.message); return; }
  byId[nodeId].parent_id = newParentId;
  rebuildIndexes();
  closeModal();
  toast('이동되었습니다');
  currentPath = currentPath.filter(id => byId[id]); // drop stale path if needed
  renderTree();
}

// ================= LEAF DRUG EDITOR =================
function renderDrugEditor(nodeId){
  const recs = linksByTaxonomy[nodeId] || [];
  const primaries = recs.filter(r=>!r.is_alt && r.tier==='primary').sort((a,b)=>a.priority-b.priority);
  const addons = recs.filter(r=>!r.is_alt && r.tier==='add_on').sort((a,b)=>a.priority-b.priority);
  const alts = recs.filter(r=>r.is_alt).sort((a,b)=>a.priority-b.priority);
  let html = '';
  if(recs.length===0){
    html += `<div class="section-label">등록된 추천약이 없습니다</div>`;
  }
  if(primaries.length){
    html += `<div class="section-label">기본 추천</div>`;
    primaries.forEach(r => html += drugCardHtml(r,''));
  }
  if(addons.length){
    html += `<div class="section-label">추가·대안</div>`;
    addons.forEach(r => html += drugCardHtml(r,'addon'));
  }
  if(alts.length){
    html += `<div class="section-label">음성 대안 — 권하는 말(⑦) 끝에 한 개까지 말함</div>`;
    alts.forEach(r => html += drugCardHtml(r,'alt'));
  }
  html += `<div class="addDrugBox">
    <div style="font-size:13px;font-weight:700;margin-bottom:8px;">+ 약 추가</div>
    <input type="text" id="drugSearchInput" placeholder="약 이름 검색..." oninput="searchDrugs(this.value)" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;">
    <div id="drugSearchResults"></div>
  </div>`;
  return html;
}

        <label>사입가</label>

      </div>

      <div class="mini-field">

          <option value="0" ${!r.is_alt?'selected':''}>아니오 (추천약)</option>

      </div>

        <label>대안 조건 (예: 마시는 게 편하시면)</label>

async function saveDrugRow(linkId, drugId){
  const tier = document.getElementById('tier-'+linkId).value;
  const priority = parseInt(document.getElementById('priority-'+linkId).value) || 1;
  const note = document.getElementById('note-'+linkId).value.trim() || null;
  const purchaseRaw = document.getElementById('purchase-'+linkId).value;
  const saleRaw = document.getElementById('sale-'+linkId).value;
  const purchase_price = purchaseRaw==='' ? null : parseInt(purchaseRaw);
  const sale_price = saleRaw==='' ? null : parseInt(saleRaw);

  const upd = { tier, priority, note };
  const altEl = document.getElementById('isalt-'+linkId);
  if(altEl){
    upd.is_alt = altEl.value === '1';
    upd.alt_when = document.getElementById('altwhen-'+linkId).value.trim() || null;
    if(upd.is_alt && !upd.alt_when){ toast('음성 대안은 대안 조건을 적어 주세요 (예: 마시는 게 편하시면)'); return; }
  }
  const { error: e1 } = await sb.from('taxonomy_drugs').update(upd).eq('id', linkId);
  if(e1){ toast('저장 실패: '+e1.message); return; }

  const { error: e2 } = await sb.from('pharmacy_drugs')
    .upsert({ pharmacy_id: PHARMACY_ID, drug_id: drugId, purchase_price, sale_price }, { onConflict: 'pharmacy_id,drug_id' });
  if(e2){ toast('가격 저장 실패: '+e2.message); return; }

  const link = LINKS.find(l=>l.id===linkId);
  if(link){ link.tier=tier; link.priority=priority; link.note=note; link.purchase_price=purchase_price; link.sale_price=sale_price;
    if(altEl){ link.is_alt=upd.is_alt; link.alt_when=upd.alt_when||''; } }
  rebuildIndexes();
  toast('저장되었습니다');
  renderTree();
}

async function deleteDrugRow(linkId){
  if(!confirm('이 약 연결을 삭제하시겠습니까? (가격 정보는 유지됩니다)')) return;
  const { error } = await sb.from('taxonomy_drugs').delete().eq('id', linkId);
  if(error){ toast('삭제 실패: '+error.message); return; }
  LINKS = LINKS.filter(l=>l.id!==linkId);
  rebuildIndexes();
  toast('삭제되었습니다');
  renderTree();
}

let drugSearchTimer = null;
async function searchDrugs(q){
  clearTimeout(drugSearchTimer);
  const box = document.getElementById('drugSearchResults');
  q = q.trim();
  if(q.length<1){ box.innerHTML=''; return; }
  drugSearchTimer = setTimeout(async ()=>{
    const { data, error } = await sb.from('drugs').select('id,name,company,category,status')
      .ilike('name', '%'+q+'%').limit(15);
    if(error){ box.innerHTML = `<div class="searchResultItem">검색 오류: ${escapeHtml(error.message)}</div>`; return; }
    let html = '';
    (data||[]).forEach(d=>{
      html += `<div class="searchResultItem" onclick="addDrugToLeaf('${d.id}','${escapeHtml(d.name)}','${escapeHtml(d.company||'')}')">
        <b>${escapeHtml(d.name)}</b><div class="sub">${escapeHtml(d.company||d.category||'')}</div>
      </div>`;
    });
    html += `<div class="searchResultItem" style="border-style:dashed;color:var(--pine);font-weight:700;" onclick="openNewDrugModal('${escapeHtml(q)}')">
      + "${escapeHtml(q)}" 목록에 없나요? 새 약으로 등록
    </div>`;
    box.innerHTML = html;
  }, 300);
}

async function addDrugToLeaf(drugId, drugName, company){
  const curId = currentPath[currentPath.length-1];
  const existingCount = (linksByTaxonomy[curId]||[]).length;
  const { data, error } = await sb.from('taxonomy_drugs')
    .insert({ taxonomy_id: curId, drug_id: drugId, tier:'primary', priority: existingCount+1 })
    .select('*, drugs(id,name,company)').single();
  if(error){ toast('추가 실패: '+error.message); return; }
  LINKS.push({
    id:data.id, taxonomy_id:data.taxonomy_id, tier:data.tier, priority:data.priority, note:data.note,
    drug_id:data.drug_id, drug_name:drugName, company:company||null, purchase_price:null, sale_price:null
  });
  rebuildIndexes();
  document.getElementById('drugSearchInput').value='';
  document.getElementById('drugSearchResults').innerHTML='';
  toast('추가되었습니다. 가격을 입력해 주세요.');
  renderTree();
}

function openNewDrugModal(prefillName){
  renderModal(`
    <div class="modal-title">새 약 등록 (검토 대기)</div>
    <div class="field"><label>약 이름</label><input type="text" id="newDrugName" value="${escapeHtml(prefillName)}"></div>
    <div class="field"><label>제조사 (선택)</label><input type="text" id="newDrugCompany"></div>
    <button class="btn btn-primary" onclick="submitNewDrug()">등록하고 연결하기</button>
    <button class="btn btn-ghost" style="margin-top:8px;width:100%;" onclick="closeModal()">취소</button>
  `);
}
async function submitNewDrug(){
  const name = document.getElementById('newDrugName').value.trim();
  const company = document.getElementById('newDrugCompany').value.trim() || null;
  if(!name){ toast('약 이름을 입력해 주세요'); return; }
  const { data, error } = await sb.from('drugs')
    .insert({ name, company, category:'일반의약품', status:'pending', submitted_by:PHARMACY_ID })
    .select().single();
  if(error){ toast('등록 실패: '+error.message); return; }
  closeModal();
  await addDrugToLeaf(data.id, data.name, data.company);
}

// ================= 코치 문장 (음성 코치·상담 화면이 읽는 말) =================
const COACH_ROOT = '코치(표준흐름)';
function isCoachNode(id){
  let n = byId[id], guard = 0;
  while(n && n.parent_id && guard++ < 20) n = byId[n.parent_id];
  return !!n && n.label === COACH_ROOT;
}
function coachPanelHtml(node, kids){
  const entry = !!node.is_entry;
  const syn = (node.synonyms || []).join(', ');
  const area = (id, label, val, rows) => `<div class="mini-field full"><label>${label}</label><textarea id="${id}" rows="${rows||2}">${escapeHtml(val||'')}</textarea></div>`;
  const warn = entry && kids.length > 3 ? `<div class="coach-warn">경우가 ${kids.length}개입니다. 한 번에 다 읽어 물으려면 3개 이하로 줄여 주세요.</div>` : '';
  const auto = entry && kids.length ? `${node.label}. ${kids.map(k=>k.label).join(', ')}. ${['','한','두','세','네','다섯'][kids.length]||kids.length} 가지입니다.` : '';
  return `<details class="coach-panel" open>
    <summary>코치 문장 — ${entry ? '주호소' : '경우'} (음성 코치·상담 화면이 읽음)</summary>
    <div class="hint">${entry
      ? '② 약사 복기에서 이 주호소를 알아듣고 → ③ 앱이 말하고 → ④ 약사가 묻고 → ⑧ 적색기를 알려 줍니다.'
      : '⑥ 약사 복기에서 이 경우를 알아듣고 → ⑦ 앱이 권하는 말을 하고 → ⑧ 복약지도를 알려 줍니다. 추천약을 바꾸면 권하는 말도 함께 고쳐 주세요.'}</div>
    ${warn}
    <div class="mini-field full"><label><span class="step">${entry ? '②' : '⑥'}</span>알아들을 말 (동의어, 쉼표로 구분)</label>
      <input type="text" id="c_syn" value="${escapeHtml(syn)}" placeholder="예: 속쓰, 쓰려, 신물"></div>
    ${entry
      ? area('c_say', '<span class="step">③</span>앱이 말하는 말 (경우 안내)', node.say_text) +
        (auto ? `<button class="btn btn-ghost btn-sm" style="margin:-4px 0 9px" onclick="document.getElementById('c_say').value=${escapeHtml(JSON.stringify(auto))}">경우 이름으로 다시 만들기</button>` : '') +
        area('c_ask', '<span class="step">④</span>약사가 물을 말 (한 번에 다 묻기)', node.ask_text) +
        area('c_guide', '<span class="step">⑧</span>이럴 땐 병원으로 (적색기)', node.guide_text, 3)
      : area('c_say', '<span class="step">⑦</span>앱이 권하는 말 (약 조합 + 대안 한 개)', node.say_text) +
        area('c_guide', '<span class="step">⑧</span>복약지도 — 이렇게 말씀하세요', node.guide_text, 3)}
    <button class="btn btn-primary btn-sm" id="btnCoachSave" onclick="saveCoachText('${node.id}')">코치 문장 저장</button>
  </details>`;
}
async function saveCoachText(id){
  const node = byId[id];
  const val = k => { const el = document.getElementById(k); return el ? (el.value.trim() || null) : undefined; };
  const upd = {
    synonyms: [...new Set(document.getElementById('c_syn').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean))],
    say_text: val('c_say'), guide_text: val('c_guide')
  };
  if(node.is_entry) upd.ask_text = val('c_ask');
  const btn = document.getElementById('btnCoachSave'); btn.disabled = true; btn.textContent = '저장 중…';
  const { error } = await sb.from('pharmacy_taxonomy').update(upd).eq('id', id);
  btn.disabled = false; btn.textContent = '코치 문장 저장';
  if(error){ toast('저장하지 못했습니다: ' + error.message); return; }
  Object.assign(node, upd);
  toast('코치 문장을 저장했습니다');
}

// ================= 약 목록 · 세트 (DB 직접 편집) =================
// 엑셀 없이 여기서만 고칩니다. 저장은 DB 함수(catalog_*)가 한 번에 처리하고 변경기록(catalog_changes)에 남깁니다.
const SYS_LIST = ['진통·해열','감기·호흡기','소화기','피부','구강','안과','신경·기타','여성·비뇨기','의약외품·의료용품'];
let VIEW = 'tree';
let CAT = { items:[], sets:[], byId:{} };
const DF = { q:'', filter:'', sys:'' };      // 약 목록 필터
let EDIT_REASONS = [];                        // 편집 중인 권매사유
let EDIT_SET = null;                          // 편집 중인 세트 { id, items:[drug_id] }

function switchView(v){
  VIEW = v;
  document.querySelectorAll('.vtab').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.getElementById('crumbbar').classList.toggle('hidden', v !== 'tree');
  document.getElementById('treeAdmin').classList.toggle('hidden', v !== 'tree');
  document.getElementById('drugAdmin').classList.toggle('hidden', v !== 'drugs');
  document.getElementById('setAdmin').classList.toggle('hidden', v !== 'sets');
  if(v === 'tree') renderTree();
  else loadCatalog();
  window.scrollTo(0,0);
}

async function loadCatalog(){
  const box = document.getElementById(VIEW === 'sets' ? 'setAdmin' : 'drugAdmin');
  if(!CAT.items.length) box.innerHTML = '<div class="section-label">불러오는 중…</div>';
  const [pd, rs, st] = await Promise.all([
    sb.from('pharmacy_drugs').select('*, drugs(name,company,ingredients,status)').eq('pharmacy_id', PHARMACY_ID),
    sb.from('pharmacy_drug_reasons').select('drug_id,priority,symptom,condition').eq('pharmacy_id', PHARMACY_ID),
    sb.from('pharmacy_sets').select('*, pharmacy_set_items(drug_id,sort)').eq('pharmacy_id', PHARMACY_ID)
  ]);
  const err = pd.error || rs.error || st.error;
  if(err){ box.innerHTML = `<div class="section-label">불러오지 못했습니다: ${escapeHtml(err.message)}</div>`; return; }
  const inTree = new Set(LINKS.map(l => l.drug_id));
  const reasons = {};
  (rs.data||[]).forEach(r => (reasons[r.drug_id] = reasons[r.drug_id] || []).push({ p:r.priority, sym:r.symptom, cond:r.condition || '' }));
  CAT.items = (pd.data||[]).map(r => ({
    id:r.drug_id, name:r.display_name || (r.drugs && r.drugs.name) || '(이름 없음)', master:r.drugs ? r.drugs.name : '',
    sys:r.system || '', dis:r.disease || '', brand:r.is_branded === true ? 'O' : r.is_branded === false ? 'X' : '',
    short:r.short_label || '', tag:r.set_tag || '', ing:r.ingredients || (r.drugs && r.drugs.ingredients) || '',
    eff:r.efficacy || '', caution:r.caution || '', maker:r.maker || (r.drugs && r.drugs.company) || '',
    supplier:r.supplier || '', note:r.note || '', price:r.sale_price, cost:r.purchase_price,
    pending:r.drugs && r.drugs.status === 'pending', inTree:inTree.has(r.drug_id),
    reasons:(reasons[r.drug_id] || []).sort((a,b) => a.p - b.p)
  })).sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  CAT.byId = {}; CAT.items.forEach(i => CAT.byId[i.id] = i);
  CAT.sets = (st.data||[]).map(s => ({ id:s.id, name:s.name, sym:s.symptom || '', cond:s.condition || '', why:s.why || '',
    p:s.priority ?? 9, items:(s.pharmacy_set_items||[]).sort((a,b) => a.sort - b.sort).map(i => i.drug_id) }))
    .sort((a,b) => a.p - b.p || a.name.localeCompare(b.name, 'ko'));
  if(VIEW === 'drugs') renderDrugList();
  if(VIEW === 'sets') renderSetList();
}

// ---------- 약 목록 ----------
function renderDrugList(){
  const box = document.getElementById('drugAdmin');
  const noPrice = CAT.items.filter(i => i.price == null).length;
  box.innerHTML = `
    <div class="cat-tools">
      <input type="search" id="dq" placeholder="약 이름·성분·권매사유 검색" value="${escapeHtml(DF.q)}" oninput="DF.q=this.value; renderDrugRows()">
      <div class="cat-row">
        <select id="dsys" onchange="DF.sys=this.value; renderDrugRows()">
          <option value="">계통 전체</option>
          ${SYS_LIST.map(s => `<option ${DF.sys===s?'selected':''}>${s}</option>`).join('')}
          <option value="__none" ${DF.sys==='__none'?'selected':''}>미분류</option>
        </select>
        <select id="dfilter" onchange="DF.filter=this.value; renderDrugRows()">
          <option value="">전체</option>
          <option value="noprice" ${DF.filter==='noprice'?'selected':''}>가격 없음 (${noPrice})</option>
          <option value="noreason" ${DF.filter==='noreason'?'selected':''}>권매사유 없음</option>
          <option value="O" ${DF.filter==='O'?'selected':''}>지명(O)</option>
          <option value="X" ${DF.filter==='X'?'selected':''}>권매(X)</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="openAddDrug()">+ 약 추가</button>
      </div>
    </div>
    <div class="section-label" id="dcount"></div>
    <div id="drows"></div>`;
  renderDrugRows();
}
function drugHay(i){ return [i.name, i.master, i.ing, i.eff, i.dis, i.short, i.maker, ...i.reasons.map(r => r.sym + ' ' + r.cond)].join(' ').toLowerCase(); }
function renderDrugRows(){
  let xs = CAT.items;
  if(DF.sys) xs = xs.filter(i => DF.sys === '__none' ? !i.sys : i.sys === DF.sys);
  if(DF.filter === 'noprice') xs = xs.filter(i => i.price == null);
  if(DF.filter === 'noreason') xs = xs.filter(i => !i.reasons.length);
  if(DF.filter === 'O' || DF.filter === 'X') xs = xs.filter(i => i.brand === DF.filter);
  const words = DF.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(words.length) xs = xs.filter(i => { const h = drugHay(i); return words.every(w => h.includes(w)); });
  document.getElementById('dcount').textContent = `${xs.length}개 품목`;
  document.getElementById('drows').innerHTML = xs.map(i => `
    <div class="cat-item" onclick="openDrugEditor('${i.id}')">
      <div class="cat-main">
        <div class="cat-name">${escapeHtml(i.name)}
          ${i.brand==='O' ? '<span class="tag tag-o">지명</span>' : i.brand==='X' ? '<span class="tag tag-x">권매</span>' : ''}
          ${i.inTree ? '<span class="tag tag-t">상담 흐름</span>' : ''}
          ${i.pending ? '<span class="tag">약국 전용</span>' : ''}</div>
        <div class="cat-sub">${escapeHtml(i.sys ? i.sys + ' · ' + i.dis : '미분류')}${i.reasons.length ? ` · 권매사유 ${i.reasons.length}` : ''}</div>
      </div>
      <div class="cat-price">${i.price != null ? Number(i.price).toLocaleString() + '원' : '<span class="tag tag-warn">가격 없음</span>'}</div>
    </div>`).join('') || '<div class="section-label">조건에 맞는 약이 없습니다.</div>';
}

function fieldHtml(label, id, value, opt={}){
  const v = value == null ? '' : escapeHtml(String(value));
  const input = opt.area ? `<textarea id="${id}" rows="2">${v}</textarea>`
              : `<input id="${id}" type="${opt.type||'text'}" value="${v}" ${opt.list?`list="${opt.list}"`:''} ${opt.type==='number'?'min="0" inputmode="numeric"':''}>`;
  return `<div class="mini-field${opt.full?' full':''}"><label>${label}</label>${input}</div>`;
}
function openDrugEditor(id){
  const i = CAT.byId[id]; if(!i) return;
  EDIT_REASONS = i.reasons.map(r => ({ ...r }));
  const diseases = [...new Set(CAT.items.map(x => x.dis).filter(Boolean))].sort((a,b) => a.localeCompare(b,'ko'));
  renderModal(`
    <div class="modal-title">${escapeHtml(i.name)}</div>
    ${i.master && i.master !== i.name ? `<div class="cat-sub" style="margin:-8px 0 10px">약 DB 이름: ${escapeHtml(i.master)}</div>` : ''}
    <div class="drug-edit-grid">
      ${fieldHtml('제품명 (화면에 보이는 이름)', 'e_name', i.name, {full:true})}
      <div class="mini-field"><label>계통</label><select id="e_sys"><option value="">미분류</option>${SYS_LIST.map(s => `<option ${i.sys===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="mini-field"><label>지명 / 권매</label><select id="e_brand">
        <option value="" ${!i.brand?'selected':''}>정하지 않음</option>
        <option value="O" ${i.brand==='O'?'selected':''}>지명(O) — 환자가 이름 대고 옴</option>
        <option value="X" ${i.brand==='X'?'selected':''}>권매(X) — 약사가 권함</option></select></div>
      ${fieldHtml('질환/증상', 'e_dis', i.dis, {full:true, list:'disList'})}
      ${fieldHtml('판매가 (원)', 'e_price', i.price, {type:'number'})}
      ${fieldHtml('사입가 (원)', 'e_cost', i.cost, {type:'number'})}
      ${fieldHtml('짧은 상담문구', 'e_short', i.short)}
      ${fieldHtml('세트태그', 'e_tag', i.tag)}
      ${fieldHtml('성분', 'e_ing', i.ing, {full:true, area:true})}
      ${fieldHtml('효능', 'e_eff', i.eff, {full:true})}
      ${fieldHtml('주의·금기', 'e_caution', i.caution, {full:true, area:true})}
      ${fieldHtml('제조사', 'e_maker', i.maker)}
      ${fieldHtml('사입처', 'e_supplier', i.supplier)}
      ${fieldHtml('비고', 'e_note', i.note, {full:true})}
    </div>
    <datalist id="disList">${diseases.map(d => `<option value="${escapeHtml(d)}">`).join('')}</datalist>
    <div class="section-label">권매사유 — 우선순위 1이 먼저 권하는 약</div>
    <div id="reasonRows"></div>
    <button class="btn btn-ghost btn-sm" onclick="EDIT_REASONS.push({p:(EDIT_REASONS.length?Math.max(...EDIT_REASONS.map(r=>r.p||1))+1:1),sym:'',cond:''}); renderReasonRows()">+ 권매사유 추가</button>
    <div class="ci-btns">
      <button class="btn btn-primary" id="btnSaveDrug" onclick="saveDrug('${i.id}')">저장</button>
    </div>
    <div class="ci-btns">
      <button class="btn btn-danger" onclick="removeDrug('${i.id}')">목록에서 빼기</button>
      <button class="btn btn-ghost" onclick="closeModal()">닫기</button>
    </div>`);
  renderReasonRows();
}
function renderReasonRows(){
  document.getElementById('reasonRows').innerHTML = EDIT_REASONS.map((r, k) => `
    <div class="reason-row">
      <input type="number" min="1" value="${r.p ?? ''}" title="우선순위" oninput="EDIT_REASONS[${k}].p=parseInt(this.value)||null">
      <input type="text" placeholder="증상 (예: 속쓰림)" value="${escapeHtml(r.sym)}" oninput="EDIT_REASONS[${k}].sym=this.value">
      <input type="text" placeholder="조건 (예: 야간·지속)" value="${escapeHtml(r.cond)}" oninput="EDIT_REASONS[${k}].cond=this.value">
      <button class="miniicon on" title="삭제" onclick="EDIT_REASONS.splice(${k},1); renderReasonRows()">&#10005;</button>
    </div>`).join('') || '<div class="cat-sub" style="margin-bottom:8px">권매사유가 없습니다.</div>';
}
const vOf = id => document.getElementById(id).value;
const numOf = id => { const v = vOf(id).trim(); if(v === '') return null; const n = parseInt(v.replace(/,/g,''), 10); return isFinite(n) ? n : NaN; };
async function saveDrug(id){
  const price = numOf('e_price'), cost = numOf('e_cost');
  if(Number.isNaN(price) || Number.isNaN(cost)){ toast('가격은 숫자로 입력해 주세요'); return; }
  if(!vOf('e_name').trim()){ toast('제품명을 입력해 주세요'); return; }
  const p = { name:vOf('e_name'), sys:vOf('e_sys'), dis:vOf('e_dis'), brand:vOf('e_brand'), short:vOf('e_short'), tag:vOf('e_tag'),
              ing:vOf('e_ing'), eff:vOf('e_eff'), caution:vOf('e_caution'), maker:vOf('e_maker'), supplier:vOf('e_supplier'),
              note:vOf('e_note'), price, cost };
  const reasons = EDIT_REASONS.filter(r => (r.sym||'').trim()).map(r => ({ p:r.p || 9, sym:r.sym, cond:r.cond }));
  const btn = document.getElementById('btnSaveDrug'); btn.disabled = true; btn.textContent = '저장 중…';
  const { error } = await sb.rpc('catalog_save_drug', { p_drug_id:id, p, p_reasons:reasons });
  if(error){ btn.disabled = false; btn.textContent = '저장'; toast('저장하지 못했습니다: ' + error.message); return; }
  closeModal(); toast('저장했습니다');
  await Promise.all([loadCatalog(), loadAll()]);
}
async function removeDrug(id){
  const i = CAT.byId[id];
  if(!confirm(`「${i.name}」을(를) 약 목록에서 뺄까요?\n가격과 권매사유도 함께 지워집니다. (변경기록에는 남습니다)`)) return;
  const { error } = await sb.rpc('catalog_remove_drug', { p_drug_id:id });
  if(error){ toast(error.message); return; }
  closeModal(); toast('목록에서 뺐습니다');
  await Promise.all([loadCatalog(), loadAll()]);
}

// 약 추가: 약 DB에서 찾아 연결, 없으면 약국 전용 약으로 새로 등록
let addTimer = null;
function openAddDrug(){
  renderModal(`
    <div class="modal-title">약 목록에 추가</div>
    <input type="search" id="addq" class="cat-input" placeholder="약 이름 검색 (약 DB 2만여 개)" oninput="searchAdd(this.value)">
    <div id="addResults"></div>
    <button class="btn btn-ghost" style="margin-top:10px;width:100%;" onclick="closeModal()">닫기</button>`);
  document.getElementById('addq').focus();
}
function searchAdd(q){
  clearTimeout(addTimer);
  q = q.trim();
  const box = document.getElementById('addResults');
  if(!q){ box.innerHTML = ''; return; }
  addTimer = setTimeout(async () => {
    const { data, error } = await sb.from('drugs').select('id,name,company,status').ilike('name', '%' + q + '%').limit(20);
    if(error){ box.innerHTML = `<div class="searchResultItem">검색 오류: ${escapeHtml(error.message)}</div>`; return; }
    box.innerHTML = (data||[]).map(d => {
      const have = !!CAT.byId[d.id];
      return `<div class="searchResultItem" ${have ? 'style="opacity:.5"' : `onclick="addDrug('${d.id}', null)"`}>
        <b>${escapeHtml(d.name)}</b>${have ? ' <span class="tag">이미 있음</span>' : ''}
        <div class="sub">${escapeHtml(d.company || '')}${d.status==='pending' ? ' · 약국 전용' : ''}</div></div>`;
    }).join('') + `<div class="searchResultItem" style="border-style:dashed;color:var(--pine);font-weight:700;" onclick="addDrug(null, document.getElementById('addq').value)">
        찾는 약이 없으면 「${escapeHtml(q)}」을(를) 약국 전용 약으로 새로 등록</div>`;
  }, 250);
}
async function addDrug(drugId, name){
  const { data, error } = await sb.rpc('catalog_add_drug', { p_drug_id:drugId, p_name:name });
  if(error){ toast(error.message); return; }
  closeModal(); toast('추가했습니다 — 가격과 분류를 채워 주세요');
  await loadCatalog();
  openDrugEditor(data);
}

// ---------- 세트 ----------

      ${fieldHtml('우선순위', 's_p', s.p, {type:'number'})}

function renderSetItems(){

      ${k > 0 ? `<button class="miniicon" title="위로" onclick="moveSetItem(${k},-1)">&#8593;</button>` : ''}

function moveSetItem(k, d){ const a = EDIT_SET.items; [a[k+d], a[k]] = [a[k], a[k+d]]; renderSetItems(); }
function renderSetPick(q){
  const box = document.getElementById('setPick');
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length){ box.innerHTML = ''; return; }
  const xs = CAT.items.filter(i => !EDIT_SET.items.includes(i.id) && words.every(w => drugHay(i).includes(w))).slice(0, 12);
  box.innerHTML = xs.map(i => `<div class="searchResultItem" onclick="EDIT_SET.items.push('${i.id}'); renderSetItems(); document.getElementById('setq').value=''; renderSetPick('')">
      <b>${escapeHtml(i.name)}</b><div class="sub">${escapeHtml(i.sys ? i.sys + ' · ' + i.dis : '미분류')}</div></div>`).join('')
    || '<div class="cat-sub">약 목록에 없습니다. 「약 목록」 탭에서 먼저 추가하세요.</div>';
}
async function saveSet(){
  const pr = numOf('s_p');
  if(Number.isNaN(pr)){ toast('우선순위는 숫자로 입력해 주세요'); return; }
  if(EDIT_SET.items.length < 2){ toast('구성 약을 2개 이상 넣어 주세요'); return; }
  const p = { name:vOf('s_name'), sym:vOf('s_sym'), cond:vOf('s_cond'), why:vOf('s_why'), p:pr };
  const btn = document.getElementById('btnSaveSet'); btn.disabled = true; btn.textContent = '저장 중…';
  const { error } = await sb.rpc('catalog_save_set', { p_set_id:EDIT_SET.id, p, p_items:EDIT_SET.items });
  if(error){ btn.disabled = false; btn.textContent = '저장'; toast('저장하지 못했습니다: ' + error.message); return; }
  closeModal(); toast('세트를 저장했습니다');
  await loadCatalog();
}
async function removeSet(id){
  const s = CAT.sets.find(x => x.id === id);
  if(!confirm(`「${s.name}」 세트를 삭제할까요? (변경기록에는 남습니다)`)) return;
  const { error } = await sb.rpc('catalog_remove_set', { p_set_id:id });
  if(error){ toast(error.message); return; }
  closeModal(); toast('세트를 삭제했습니다');
  await loadCatalog();
}

// ================= MODAL =================
function renderModal(innerHtml){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal-sheet">${innerHtml}</div>
    </div>
  `;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

// ================= INIT =================
(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    PHARMACY_ID = session.user.id;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
    await loadAll();
  }
})();
document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
