<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상담 코치 — 성빈약국</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#F2F4F3;
    --card:#FFFFFF;
    --ink:#16201C;
    --muted:#69736E;
    --line:#DDE3E0;
    --green:#0E6B4E;
    --green-soft:#E6F1EC;
    --amber:#8A5A12;
    --amber-soft:#FBF1DF;
    --danger:#8C2F24;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:17px;
    line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 72px}

  header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  header h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
  header .who{margin-left:auto;font-size:13px;color:var(--muted)}
  header button.link{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px;text-decoration:underline;font-family:inherit}

  /* 크게 누르는 말하기 버튼 */
  .talk{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    font:inherit;font-size:19px;font-weight:700;letter-spacing:-.01em;
    padding:18px 16px;margin-bottom:10px;cursor:pointer;
    border:2px solid var(--green);border-radius:var(--r);
    background:var(--card);color:var(--green);
    -webkit-tap-highlight-color:transparent;
  }
  .talk.on{background:var(--green);color:#fff}
  .talk:focus-visible{outline:3px solid var(--green-soft);outline-offset:3px}
  .talk .dot{flex:none;width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.35}
  .talk.on .dot{opacity:1}
  @media (prefers-reduced-motion:no-preference){
    .talk.on .dot{animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  }
  .heardline{
    min-height:22px;margin:0 2px 14px;font-size:15px;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .heardline.used{color:var(--green);font-weight:600}

  .ask{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .ask label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}
  .row{display:flex;gap:8px}
  input[type=text],input[type=email],input[type=password]{
    flex:1;min-width:0;font:inherit;font-size:19px;padding:13px 14px;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  input:focus{outline:3px solid var(--green-soft);border-color:var(--green)}
  button.go{
    font:inherit;font-weight:600;font-size:17px;padding:13px 20px;border:0;border-radius:10px;
    background:var(--green);color:#fff;cursor:pointer;white-space:nowrap;
  }
  button.go:disabled{opacity:.45;cursor:default}
  button.go:focus-visible,button.opt:focus-visible{outline:3px solid var(--green-soft);outline-offset:2px}

  .say{
    margin:18px 0 0;background:var(--green-soft);border-radius:var(--r);
    padding:16px 18px;font-size:21px;font-weight:600;letter-spacing:-.01em;color:#0B4A36;
  }
  .say small{display:block;font-size:13px;font-weight:500;color:#3C7761;margin-bottom:5px;letter-spacing:0}

  .cases{margin-top:14px;display:grid;gap:8px}
  button.opt{
    font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:15px 16px;font-size:19px;font-weight:600;cursor:pointer;color:var(--ink);
  }
  button.opt:hover{border-color:var(--green)}

  .result{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .result h2{margin:0;padding:14px 18px;font-size:15px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
  .drug{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .drug:last-child{border-bottom:0}
  .tier{
    flex:none;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;margin-top:3px;
    background:var(--green-soft);color:#0B4A36;
  }
  .tier.add{background:var(--amber-soft);color:var(--amber)}
  .drug .name{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .drug .meta{font-size:14px;color:var(--muted);margin-top:2px}
  .drug .price{margin-left:auto;flex:none;font-size:17px;font-weight:600;color:var(--muted);white-space:nowrap}

  .crumb{margin-top:16px;font-size:14px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:600}
  .guessed{
    display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;
    background:var(--amber-soft);color:var(--amber);font-size:12px;font-weight:600;
  }
  .note{margin-top:14px;padding:14px 16px;border-radius:var(--r);background:#FCEFEC;color:var(--danger);font-size:15px}
  .note b{font-weight:700}
  .again{margin-top:18px}
  button.reset{
    font:inherit;font-size:15px;padding:11px 18px;border:1px solid var(--line);
    background:var(--card);border-radius:10px;cursor:pointer;color:var(--muted);
  }
  .hidden{display:none}

  /* v8 — ③④⑦⑧ */
  .hint{margin-top:10px;font-size:14px;color:var(--muted)}
  .hint b{color:var(--ink);font-weight:600}
  .alts{margin-top:10px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r);overflow:hidden}
  .alts h3{margin:0;padding:12px 18px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:1px dashed var(--line)}
  .alt{display:flex;align-items:baseline;gap:10px;padding:12px 18px;border-bottom:1px dashed var(--line);font-size:16px}
  .alt:last-child{border-bottom:0}
  .alt .when{color:var(--muted);flex:none;max-width:48%}
  .alt .aname{font-weight:700}
  .alt .aprice{margin-left:auto;flex:none;color:var(--muted);font-size:15px;white-space:nowrap}
  .guide{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .guide small{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .guide p{margin:0;font-size:18px;line-height:1.6}
  .redflag{margin-top:10px;padding:14px 16px;border-radius:var(--r);background:#FCEFEC;color:var(--danger);font-size:16px;line-height:1.6}
  .redflag small{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
  button.listen{
    margin-top:12px;width:100%;font:inherit;font-size:17px;font-weight:600;padding:13px 16px;
    border:1px solid var(--green);border-radius:10px;background:var(--card);color:var(--green);cursor:pointer;
  }
  button.listen:focus-visible{outline:3px solid var(--green-soft);outline-offset:2px}
  @media (max-width:420px){ .alt{flex-wrap:wrap} .alt .when{max-width:100%;width:100%} .alt .aprice{margin-left:0} }

  .login{max-width:360px;margin:14vh auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
  .login h1{font-size:20px;margin:0 0 4px}
  .login p{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .login input{width:100%;margin-bottom:10px;font-size:17px}
  .login button{width:100%}
  .err{color:var(--danger);font-size:14px;margin-top:10px}

  .drug > div:not(.price){flex:1;min-width:0}
  @media (max-width:420px){
    .row{flex-direction:column}
    button.go{width:100%}
    .drug{flex-wrap:wrap}
    .drug .price{margin-left:auto}
  }
  @media (prefers-reduced-motion:no-preference){
    .say,.cases,.result{animation:rise .16s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1>상담 코치</h1>
  <p>약국 계정으로 로그인하세요.</p>
  <input id="email" type="email" placeholder="이메일" autocomplete="username">
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="go" id="btnLogin">로그인</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="wrap hidden">
  <header>
    <h1>상담 코치</h1>
    <span class="who" id="who"></span>
    <button class="link" id="btnLogout">로그아웃</button>
  </header>

  <button class="talk" id="btnTalk">
    <span class="dot"></span>
    <span id="talkLbl">탭하고 말씀하세요</span>
  </button>
  <div class="heardline" id="heard"></div>

  <div id="step1" class="ask">
    <label for="u1">환자가 뭐라고 하셨나요</label>
    <div class="row">
      <input id="u1" type="text" placeholder="머리가 아파요" autocomplete="off" autocapitalize="off">
      <button class="go" id="btn1">찾기</button>
    </div>
  </div>

  <div id="miss1" class="note hidden"></div>

  <div id="stage2" class="hidden">
    <div class="say" id="say1"></div>
    <div class="cases" id="cases"></div>

    <div class="ask" style="margin-top:14px">
      <label for="u2" id="u2lbl">환자 답을 복기하세요</label>
      <div class="row">
        <input id="u2" type="text" placeholder="체하고 나서요" autocomplete="off" autocapitalize="off">
        <button class="go" id="btn2">약 보기</button>
      </div>
    </div>
    <div id="miss2" class="note hidden"></div>
  </div>

  <div id="stage3" class="hidden">
    <div class="crumb" id="crumb"></div>
    <div class="result" id="result"></div>
    <div class="alts hidden" id="alts"></div>
    <div class="guide hidden" id="guide"></div>
  </div>

  <div class="again hidden" id="againBox">
    <button class="reset" id="btnReset">새 손님</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://letwvftkomuxxbhnswyf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ow_wnycgPkTubzv-sjg96w_by39lUOF';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let state = { pharmacyId:null, entryId:null, entryLabel:null, entryGuide:'', guideText:'' };

/* ── 인증 ── */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show('login'); return; }
  state.pharmacyId = session.user.id;
  const { data } = await sb.from('pharmacies').select('name').eq('id', session.user.id).maybeSingle();
  $('who').textContent = data?.name || session.user.email;
  show('app');
  $('u1').focus();
}
function show(which){
  $('login').classList.toggle('hidden', which!=='login');
  $('app').classList.toggle('hidden', which!=='app');
}
$('btnLogin').onclick = async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('pw').value });
  if(error){ $('loginErr').textContent = '로그인하지 못했습니다. 이메일과 비밀번호를 확인하세요.'; return; }
  boot();
};
$('pw').addEventListener('keydown', e => { if(e.key==='Enter') $('btnLogin').click(); });
$('btnLogout').onclick = async () => { stopMic(); await sb.auth.signOut(); location.reload(); };

/* ── 발화 판정 ── */
const RE_QUESTION = /(세요|나요|어요|까요|습니까|신가요|으세요|어떠세요|어떠신가요)\s*[?？]?\s*$/;
/* v8: 복기는 "~거죠?"처럼 물음표가 붙어도 복기로 본다 */
const RE_RECAP = /(시군요|군요|시네요|네요|이시죠|시죠|죠|습니다|입니다|드릴게요|드리겠습니다|거죠|거네요|셨군요)\s*[.!?？]?\s*$/;
const IGNORE = ['네','예','아니요','아뇨','잠시만요','잠깐만요','알겠습니다','감사합니다','안녕하세요',
                '어서오세요','또 오세요','안녕히 가세요','맞습니다','그러세요','괜찮습니다','네 알겠습니다'];

function classify(text){
  const t = (text||'').trim();
  if(t.length < 3) return 'ignore';
  const bare = t.replace(/[.!?？]/g,'').trim();
  if(IGNORE.some(w => bare === w)) return 'ignore';
  if(RE_RECAP.test(t)) return 'recap';          // 복기 어미가 먼저
  if(/[?？]\s*$/.test(t)) return 'question';
  if(RE_QUESTION.test(t)) return 'question';
  return 'ignore';
}

/* ── 음성 인식 ──
   iOS 사파리는 한 번 결과를 내면 세션이 사실상 죽는데 종료 이벤트가 오지 않는다.
   그래서 결과를 받는 즉시 세션을 끊고 매번 새로 만든다 — '한 번 탭 = 한 번 말하기'.
   자동 재시작이 되는 브라우저(안드로이드·PC 크롬)에서는 끊지 않고 이어서 듣는다. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let rec = null, listening = false, wantContinue = false, speaking = false;
let restartTimer = null, idleTimer = null;

$('btnTalk').onclick = () => listening ? stopMic() : startMic();

function buildRec(){
  const r = new SR();
  r.lang = 'ko-KR';
  r.continuous = !IS_IOS;        // iOS는 한 마디씩
  r.interimResults = false;
  r.maxAlternatives = 1;

  r.onstart = () => {
    listening = true;
    if(restartTimer){ clearTimeout(restartTimer); restartTimer = null; }
    armIdleTimer();
    paintMic();
  };
  r.onresult = e => {
    const t = e.results[e.results.length-1][0].transcript.trim();
    if(IS_IOS) endSession();     // 결과가 나오면 곧바로 정리하고 다음 탭을 기다린다
    else armIdleTimer();
    if(speaking) return;
    handleSpeech(t);
  };
  r.onerror = e => {
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      endSession();
      setHeard('마이크 사용이 차단돼 있습니다. 설정에서 허용하세요.', false);
    }
  };
  r.onend = () => {
    listening = false;
    if(wantContinue && !IS_IOS) tryRestart(); else endSession();
  };
  return r;
}

/* 세션을 완전히 정리하고 대기 상태로 */
function endSession(){
  wantContinue = false;
  listening = false;
  if(restartTimer){ clearTimeout(restartTimer); restartTimer = null; }
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(rec){
    try{ rec.onend = rec.onresult = rec.onerror = rec.onstart = null; rec.stop(); }catch(_){}
    rec = null;                  // 다음엔 새 객체로 시작
  }
  paintMic();
}

/* 15초간 아무 말도 없으면 알아서 내려놓는다 */
function armIdleTimer(){
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(endSession, 15000);
}

function startMic(){
  if(!SR){
    setHeard('이 브라우저는 음성 인식을 지원하지 않습니다.', false);
    return;
  }
  unlockTTS();                 // iOS: 사용자 조작 시점에 음성 출력 잠금 해제
  if(rec) endSession();
  rec = buildRec();
  wantContinue = true;
  try{ rec.start(); }catch(_){ endSession(); return; }
  paintMic();
}

/* 자동 재시작을 시도하고, 막히면 조용히 대기 상태로 돌아간다 */
function tryRestart(){
  if(!rec) return;
  try{ rec.start(); }
  catch(_){ endSession(); return; }
  if(restartTimer) clearTimeout(restartTimer);
  restartTimer = setTimeout(() => { if(!listening) endSession(); }, 900);
}

/* iOS 사파리는 사용자 조작 없이 음성 출력을 막는다.
   버튼을 누른 순간 무음 한 번을 재생해 잠금을 푼다. */
let ttsUnlocked = false;
function unlockTTS(){
  if(ttsUnlocked || !('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0; u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
    ttsUnlocked = true;
  }catch(_){}
}

function stopMic(){
  endSession();
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
}

function paintMic(){
  $('btnTalk').classList.toggle('on', listening);
  $('talkLbl').textContent = listening
    ? (IS_IOS ? '말씀하세요' : '듣고 있습니다 — 탭하면 멈춤')
    : '탭하고 말씀하세요';
}
function setHeard(text, used){
  const el = $('heard');
  el.textContent = text;
  el.classList.toggle('used', !!used);
}

let lastSpeech = { text:'', at:0 };
function handleSpeech(text){
  const now = Date.now();
  if(text === lastSpeech.text && now - lastSpeech.at < 2000) return;   // 같은 결과 중복 처리 방지
  lastSpeech = { text, at: now };
  if(classify(text) !== 'recap'){ setHeard(text, false); return; }
  setHeard(text, true);
  if(state.entryId) pick(text); else findEntry(text);
}

/* ── 음성 안내 ──
   안내가 '실제로 재생을 시작했을 때만' 마이크 입력을 잠시 무시한다.
   iOS처럼 재생이 차단되는 환경에서는 잠그지 않아, 바로 다음 말을 받을 수 있다. */
let speakGuard = null;
function releaseSpeaking(){
  speaking = false;
  if(speakGuard){ clearTimeout(speakGuard); speakGuard = null; }
}
function speak(text){
  releaseSpeaking();
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 1.05;
    u.onstart = () => {                         // 재생이 시작된 경우에만 잠금
      speaking = true;
      if(speakGuard) clearTimeout(speakGuard);
      speakGuard = setTimeout(releaseSpeaking, Math.min(2000 + text.length*180, 9000));
    };
    u.onend = u.onerror = releaseSpeaking;
    window.speechSynthesis.speak(u);
  }catch(_){ releaseSpeaking(); }
}

/* 받침 유무로 은/는 선택 */
function josaEunNeun(word){
  const ch = (word||'').replace(/[^가-힣a-zA-Z0-9]/g,'').slice(-1);
  if(!ch) return '는';
  const code = ch.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return '는';
  return ((code - 0xAC00) % 28) ? '은' : '는';
}

/* ── 1단계 ── */
$('btn1').onclick = () => findEntry($('u1').value.trim());
$('u1').addEventListener('keydown', e => { if(e.key==='Enter') findEntry($('u1').value.trim()); });

async function findEntry(text){
  if(!text) return;
  $('u1').value = text;
  $('btn1').disabled = true;
  $('miss1').classList.add('hidden');

  const { data, error } = await sb.rpc('coach_start', { p_utterance: text });
  $('btn1').disabled = false;

  if(error){ warn('miss1', '조회하지 못했습니다. 다시 시도하세요.'); return; }
  if(!data || !data.length){
    warn('miss1', '<b>' + esc(text) + '</b> — 해당하는 증상을 찾지 못했습니다. 다른 표현으로 말씀해 보세요.');
    logMiss(null, text);
    return;
  }

  const hit = data[0];
  state.entryId = hit.node_id;
  state.entryLabel = hit.label;
  const kids = hit.children || [];

  // v8: 주호소 노드의 ③음성·④질문·⑧적색기 문장
  const node = await fetchNode(hit.node_id);
  state.entryGuide = node.guide_text || '';

  const nm = shortName(hit.label);
  const askText = node.ask_text
    || kids.map(c => c.label).join('? ') + '?';
  $('say1').innerHTML = '<small>' + (hit.guess ? '「' + esc(nm) + '」로 이해했습니다 — 맞으면 이렇게 물어보세요' : '이렇게 물어보세요')
    + '</small>' + esc(askText);
  $('cases').innerHTML = '';
  kids.forEach(c => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = c.label;
    b.onclick = () => pick(c.label);
    $('cases').appendChild(b);
  });

  $('stage2').classList.remove('hidden');
  $('stage3').classList.add('hidden');
  $('againBox').classList.remove('hidden');
  $('u2').value = '';
  $('u2').placeholder = kids.map(c => c.label).join(' / ');
  $('u2lbl').innerHTML = '환자 답을 복기하세요 — 끝을 <b>「~거죠」「~군요」</b>로';
  $('stage2').scrollIntoView({ behavior:'smooth', block:'nearest' });
  if(!listening) $('u2').focus();     // 음성 대기 중이면 키보드를 띄우지 않는다

  // ③ 앱 음성
  speak(node.say_text || (nm + '. ' + kids.map(c => c.label).join(', ') + '. ' + kids.length + '가지입니다.'));
}

async function fetchNode(id){
  try{
    const { data } = await sb.rpc('coach_node', { p_node_id: id });
    return data || {};
  }catch(_){ return {}; }
}
async function fetchAlts(id){
  try{
    const { data } = await sb.rpc('coach_alts', { p_node_id: id });
    return Array.isArray(data) ? data : [];
  }catch(_){ return []; }
}

/* ── 2단계 ── */
$('btn2').onclick = () => pick($('u2').value.trim());
$('u2').addEventListener('keydown', e => { if(e.key==='Enter') pick($('u2').value.trim()); });

async function pick(text){
  if(!text || !state.entryId) return;
  $('u2').value = text;
  $('btn2').disabled = true;
  $('miss2').classList.add('hidden');

  const { data, error } = await sb.rpc('coach_pick', { p_parent_id: state.entryId, p_utterance: text });
  $('btn2').disabled = false;

  if(error){ warn('miss2', '조회하지 못했습니다. 다시 시도하세요.'); return; }
  const r = data && data[0];
  if(!r || !r.matched){
    warn('miss2', '<b>' + esc(text) + '</b> — 어느 쪽인지 가리지 못했습니다. 위 목록에서 눌러 주세요.');
    logMiss(state.entryId, text);
    return;
  }

  $('crumb').innerHTML = esc(state.entryLabel) + ' › <b>' + esc(r.label) + '</b>'
    + (r.guess ? ' <span class="guessed">이렇게 이해했습니다</span>' : '');
  const drugs = r.drugs || [];
  $('result').innerHTML = '<h2>' + esc(r.label) + '</h2>' + (
    drugs.length
      ? drugs.map(d => `
        <div class="drug">
          <span class="tier${d.tier==='add_on'?' add':''}">${d.tier==='add_on'?'함께':'기본'}</span>
          <div>
            <div class="name">${esc(d.name)}</div>
            ${d.note ? '<div class="meta">'+esc(d.note)+'</div>' : ''}
          </div>
          ${d.sale_price ? '<div class="price">'+Number(d.sale_price).toLocaleString()+'원</div>' : ''}
        </div>`).join('')
      : '<div class="drug"><div><div class="name">추천약 준비 중</div></div></div>'
  );
  // v8: 분기 문장(⑦⑧) + 대안
  const [node, alts] = await Promise.all([fetchNode(r.node_id), fetchAlts(r.node_id)]);

  if(alts.length){
    $('alts').innerHTML = '<h3>상황에 따라</h3>' + alts.map(a => `
      <div class="alt">
        <span class="when">${esc(a.alt_when || '')}</span>
        <span class="aname">${esc(plain(a.name))}</span>
        ${a.sale_price ? '<span class="aprice">'+Number(a.sale_price).toLocaleString()+'원</span>' : ''}
      </div>`).join('');
    $('alts').classList.remove('hidden');
  } else {
    $('alts').classList.add('hidden');
  }

  const g = node.guide_text || '';
  const red = state.entryGuide || '';
  state.guideText = [g, red].filter(Boolean).join(' ');
  if(g || red){
    $('guide').innerHTML = '<small>⑧ 복약지도 — 환자에게 이렇게 말씀하세요</small>'
      + (g ? '<p>' + esc(g) + '</p>' : '')
      + (red ? '<div class="redflag"><small>이럴 땐 병원으로</small>' + esc(red) + '</div>' : '')
      + '<button class="listen" id="btnGuide">복약지도 듣기</button>';
    $('guide').classList.remove('hidden');
    $('btnGuide').onclick = () => { unlockTTS(); speak(state.guideText); };
  } else {
    $('guide').classList.add('hidden');
  }

  $('stage3').classList.remove('hidden');
  $('stage3').scrollIntoView({ behavior:'smooth', block:'nearest' });

  // ⑦ 앱 음성
  speak(node.say_text || (drugs.length ? drugs.map(d => plain(d.name)).join(', ') : '추천약이 아직 없습니다'));
}

/* ── 보조 ── */
$('btnReset').onclick = () => {
  state = { pharmacyId: state.pharmacyId, entryId:null, entryLabel:null, entryGuide:'', guideText:'' };
  $('alts').classList.add('hidden');
  $('guide').classList.add('hidden');
  $('u1').value=''; $('u2').value='';
  $('stage2').classList.add('hidden');
  $('stage3').classList.add('hidden');
  $('againBox').classList.add('hidden');
  $('miss1').classList.add('hidden');
  $('miss2').classList.add('hidden');
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  setHeard('', false);
  $('u1').focus();
};

function warn(id, html){ const el=$(id); el.innerHTML=html; el.classList.remove('hidden'); }
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shortName(label){
  const m = String(label||'').match(/\(([^)]+)\)\s*$/);   // "콧물·코막힘(비염)" → "비염"
  if(m) return m[1].trim();
  return String(label||'').replace(/[·].*$/,'').trim();
}
function plain(name){ return name.replace(/\(.*?\)/g,'').trim(); }
async function logMiss(parentId, text){
  try{ await sb.from('coach_misses').insert({ pharmacy_id: state.pharmacyId, parent_id: parentId, utterance: text }); }
  catch(e){ }
}

boot();
</script>
