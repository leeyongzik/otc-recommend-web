<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 화면 — 성빈약국</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:#F2F4F3; --card:#FFFFFF; --ink:#16201C; --muted:#69736E; --line:#DDE3E0;
    --green:#0E6B4E; --green-soft:#E6F1EC; --green-ink:#0B4A36;
    --amber:#8A5A12; --amber-soft:#FBF1DF;
    --danger:#8C2F24; --danger-soft:#FCEFEC;
    --blue:#1D4E89; --blue-soft:#E8EFF8;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
       font-family:Pretendard Variable,Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       font-size:15px;line-height:1.55}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:10px 18px;
         display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
  header .sp{flex:1}
  header input{flex:1;min-width:250px;max-width:560px;font:inherit;font-size:15px;padding:9px 13px;
               border:0;border-radius:10px}
  header button{font:inherit;font-size:13px;background:rgba(255,255,255,.16);color:#fff;border:0;
                border-radius:8px;padding:7px 11px;cursor:pointer}
  header button:hover{background:rgba(255,255,255,.28)}
  header .who{font-size:12.5px;opacity:.85}
  main{max-width:1180px;margin:0 auto;padding:16px 18px 60px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){ .row{grid-template-columns:1fr} header input{min-width:180px} }
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}
  .box h2{font-size:12px;margin:0 0 10px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);
        border-radius:999px;padding:6px 12px;cursor:pointer}
  .chip:hover{border-color:var(--green)}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .chip small{opacity:.6;margin-left:4px;font-size:11.5px}
  .ask{background:var(--green-soft);border-radius:10px;padding:11px 13px;margin-bottom:11px}
  .ask small{display:block;font-size:11.5px;color:var(--green-ink);opacity:.8;margin-bottom:3px}
  .ask b{font-size:17px;font-weight:700;color:var(--green-ink)}
  .cases{display:flex;flex-wrap:wrap;gap:8px}
  .case{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);
        border-radius:10px;padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .case:hover{border-color:var(--green)}
  .case.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .case .key{font-size:11px;background:rgba(0,0,0,.08);border-radius:5px;padding:1px 5px}
  .case.on .key{background:rgba(255,255,255,.22)}
  .recap{margin-top:10px;font-size:14px;color:var(--muted)}
  .drug{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .drug:first-child{border-top:0}
  .tier{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;background:var(--green);
        border-radius:6px;padding:2px 7px;margin-top:3px}
  .tier.add{background:var(--blue)} .tier.alt{background:var(--amber)} .tier.none{background:var(--danger)}
  .drug .body{flex:1;min-width:0}
  .drug .nm{font-size:17px;font-weight:700}
  .drug .nt{font-size:13.5px;color:var(--muted)}
  .drug .when{font-size:12.5px;color:var(--amber)}
  .drug .sh{display:inline-block;font-size:12.5px;color:var(--green-ink);background:var(--green-soft);
            border-radius:6px;padding:1px 7px;margin-top:3px}
  .drug .pr{flex:0 0 auto;text-align:right;font-size:15px;font-weight:700}
  .drug .pr .c{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
  .say{margin-top:12px;background:var(--green-soft);border-radius:10px;padding:11px 13px;font-size:16px;
       font-weight:600;color:var(--green-ink)}
  .guide{margin-top:9px;font-size:14px;color:var(--muted);white-space:pre-wrap}
  .red{margin-top:9px;background:var(--danger-soft);color:var(--danger);border-radius:10px;
       padding:9px 12px;font-size:13.5px;white-space:pre-wrap}
  .named{background:var(--amber-soft);border:1px solid #E7D4AE;border-radius:10px;padding:11px 13px;
         margin-bottom:11px;font-size:14px}
  .named b{font-size:16px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .tools select,.tools input{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--line);
                             border-radius:9px;background:var(--card)}
  .note{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .card{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--card)}
  .card .n{font-size:15.5px;font-weight:700}
  .card .tags{font-size:12px;color:var(--muted);margin-top:3px}
  .card .kv{font-size:12.5px;color:var(--muted);margin-top:6px}
  .card .kv span{color:var(--ink);font-weight:600;margin-right:4px}
  .card .money{margin-top:8px;font-size:15px;font-weight:700}
  .card .money .cost{font-size:12px;font-weight:400;color:var(--muted);margin-left:7px}
  .card ul{margin:7px 0 0;padding:0;list-style:none}
  .card li{font-size:12.5px;color:var(--muted);display:flex;gap:6px}
  .card li .p{background:var(--green-soft);color:var(--green-ink);border-radius:5px;padding:0 5px;font-size:11px}
  .badge{font-size:11px;border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:2px}
  .b-o{background:var(--amber-soft);color:var(--amber)} .b-x{background:var(--green-soft);color:var(--green-ink)}
  .login{max-width:360px;margin:14vh auto;background:var(--card);border:1px solid var(--line);
         border-radius:var(--r);padding:24px}
  .login h1{font-size:20px;margin:0 0 4px}.login p{margin:0 0 16px;font-size:14px;color:var(--muted)}
  .login input{width:100%;margin-bottom:10px;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px}
  .login button{width:100%;border:0;border-radius:10px;padding:12px;background:var(--green);color:#fff;
                font-weight:600;cursor:pointer}
  .err{color:var(--danger);font-size:13px;min-height:18px}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1>상담 화면</h1>
  <p>약국 계정으로 로그인하세요.</p>
  <input type="email" id="email" placeholder="이메일" autocomplete="username">
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
  <button id="btnLogin">로그인</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>상담 화면</h1>
    <input id="q" placeholder="환자가 한 말 또는 약 이름 — 예: 속이 쓰려요, 파모티딘" autocomplete="off">
    <button id="btnFind">찾기</button>
    <span class="sp"></span>
    <button id="btnCost">원가</button>
    <button id="btnReload">새로고침</button>
    <button id="btnReset">새 손님</button>
    <span class="who" id="who"></span>
    <button id="btnLogout">로그아웃</button>
  </header>

  <main>
    <div class="box" style="margin-bottom:14px">
      <h2>증상</h2>
      <div class="chips" id="symChips"></div>
    </div>

    <div class="row" style="margin-bottom:14px">
      <div class="box">
        <h2>① 물어볼 말</h2>
        <div id="askBody"><div class="empty">위에서 증상을 고르거나 환자 말을 입력하세요.</div></div>
      </div>
      <div class="box">
        <h2>② 권하는 약</h2>
        <div id="recBody"><div class="empty">경우를 고르면 약이 나옵니다.</div></div>
      </div>
    </div>

    <div class="box">
      <h2>약 목록</h2>
      <div class="tools">
        <input type="search" id="dq" placeholder="약 이름·성분·증상 검색" style="min-width:220px">
        <select id="dsys"><option value="">계통 전체</option></select>
        <select id="dbrand">
          <option value="">지명·상담 전체</option>
          <option value="X">상담품목만</option>
          <option value="O">지명품목만</option>
        </select>
        <select id="dsort">
          <option value="name">이름 순</option>
          <option value="price">판매가 낮은 순</option>
          <option value="profit">수익 높은 순</option>
        </select>
        <span class="note" id="dinfo"></span>
      </div>
      <div class="note" id="dcount" style="margin-bottom:8px"></div>
      <div class="grid" id="dgrid"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient('https://letwvftkomuxxbhnswyf.supabase.co',
                                 'sb_publishable_Ow_wnycgPkTubzv-sjg96w_by39lUOF');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => n == null ? '' : Number(n).toLocaleString('ko-KR') + '원';
const norm = s => String(s || '').replace(/[^가-힣A-Za-z0-9]/g, '').toLowerCase();

const S = {
  symptoms: [], items: [], byDrug: {},
  sym: null, kase: null, showCost: false,
  dq: '', dsys: '', dbrand: '', dsort: 'name', named: null, updated: null, allSym: false
};

/* ── 데이터 ── */
async function loadAll(){
  const [flow, cat] = await Promise.all([sb.rpc('flow_all'), sb.rpc('flow_catalog')]);
  S.symptoms = (flow.data && flow.data.symptoms) || [];
  S.items = (cat.data && cat.data.items) || [];
  S.byDrug = {}; S.items.forEach(i => S.byDrug[i.id] = i);
  S.updated = (flow.data && flow.data.updated) || null;
  const sys = [...new Set(S.items.map(i => i.sys).filter(Boolean))].sort((a,b) => a.localeCompare(b,'ko'));
  $('dsys').innerHTML = '<option value="">계통 전체</option>'
    + sys.map(s => `<option>${esc(s)}</option>`).join('') + '<option value="__none">미분류</option>';
  $('dinfo').textContent = `증상 ${S.symptoms.length} · 약 ${S.items.length}품목`;
  renderSymptoms(); renderList();
}

/* ── 증상 칩 ── */
function renderSymptoms(){
  const withFlow = S.symptoms.filter(s => (s.cases || []).length);
  const shown = S.allSym ? withFlow : withFlow.slice(0, 12);
  const chip = s => `<button class="chip${S.sym && S.sym.id === s.id ? ' on' : ''}" data-sym="${s.id}">${esc(s.name)}`
    + `<small>${s.cases.length > 1 ? s.cases.length + '경우' : ''}</small></button>`;
  const picked = S.sym && !shown.includes(S.sym) ? chip(S.sym) : '';
  $('symChips').innerHTML = picked + shown.map(chip).join('')
    + (withFlow.length > shown.length
       ? `<button class="chip" id="chipMore">+ ${withFlow.length - shown.length}개 더</button>`
       : (S.allSym ? '<button class="chip" id="chipLess">접기</button>' : ''));
}

/* ── 찾기 ── */
function findSymptom(text){
  const k = norm(text); if(!k) return null;
  let hit = S.symptoms.find(s => norm(s.name) === k);
  if(hit) return hit;
  hit = S.symptoms.find(s => (s.syn || []).some(x => norm(x) && k.includes(norm(x))));
  if(hit) return hit;
  return S.symptoms.find(s => norm(s.name) && (k.includes(norm(s.name)) || norm(s.name).includes(k))) || null;
}
function findDrug(text){
  const k = norm(text); if(k.length < 2) return null;
  return S.items.find(i => norm(i.name) === k)
      || S.items.find(i => norm(i.name).includes(k) || (i.master && norm(i.master).includes(k))) || null;
}
function symptomsOfDrug(drug){
  const ids = new Set((drug.lines || []).map(l => l.sym_id));
  return S.symptoms.filter(s => ids.has(s.id));
}

function doFind(){
  const t = $('q').value.trim(); if(!t) return;
  S.named = null;
  const sym = findSymptom(t);
  if(sym){ chooseSymptom(sym); return; }
  const drug = findDrug(t);
  if(drug){
    S.named = drug;
    const syms = symptomsOfDrug(drug);
    if(syms.length === 1){ chooseSymptom(syms[0]); return; }
    S.sym = null; S.kase = null; renderSymptoms();
    $('askBody').innerHTML = namedBanner(drug)
      + (syms.length
         ? `<div class="cases">${syms.map(s => `<button class="case" data-sym="${s.id}">${esc(s.name)}</button>`).join('')}</div>`
         : `<div class="empty">이 약에 증상이 적혀 있지 않습니다 — 관리자 화면에서 증상을 넣어 주세요.</div>`);
    $('recBody').innerHTML = '<div class="empty">증상을 고르면 상담품목이 나옵니다.</div>';
    S.dq = t; $('dq').value = t; renderList();
    return;
  }
  $('askBody').innerHTML = `<div class="empty"><b>${esc(t)}</b> — 증상에도 약 이름에도 없습니다. 아래 약 목록에서 찾아보세요.</div>`;
  S.dq = t; $('dq').value = t; renderList();
}
function namedBanner(drug){
  return `<div class="named"><b>${esc(drug.name)}</b>은(는) ${drug.brand === 'O' ? '지명품목' : '약 이름'}입니다`
    + `${drug.price ? ' · ' + won(drug.price) : ''}.<br>증상부터 상담해 상담품목으로 권해 보세요.</div>`;
}

/* ── 증상 → 경우 ── */
function chooseSymptom(sym){
  S.sym = sym; S.kase = null;
  renderSymptoms(); renderAsk();
  $('recBody').innerHTML = '<div class="empty">환자 답에 맞는 경우를 고르세요.</div>';
  const cases = sym.cases || [];
  if(cases.length === 1) chooseCase(0);
  renderList();
}
function renderAsk(){
  const s = S.sym; if(!s) return;
  const cases = s.cases || [];
  const labels = cases.filter(c => c.label).map(c => c.label);
  const ask = s.ask || (labels.length ? labels.join('? ') + '?' : s.name + ' 때문에 오셨군요.');
  let h = S.named ? namedBanner(S.named) : '';
  h += `<div class="ask"><small>이렇게 물어보세요</small><b>${esc(ask)}</b></div>`;
  if(labels.length){
    h += `<div class="cases">${cases.map((c,i) =>
      `<button class="case${S.kase === c ? ' on' : ''}" data-case="${i}">`
      + `${i < 9 ? `<span class="key">${i+1}</span>` : ''}${esc(c.label || '기본')}</button>`).join('')}</div>`;
  }
  if(S.kase) h += `<div class="recap">복기: <b>"${esc(S.kase.label || S.sym.name)}이신 거죠?"</b></div>`;
  $('askBody').innerHTML = h;
}
function chooseCase(i){
  const c = ((S.sym && S.sym.cases) || [])[i]; if(!c) return;
  S.kase = c; renderAsk(); renderRec(c);
}

/* ── 추천 ── */
function priceCell(d){
  const it = S.byDrug[d.drug_id];
  const sale = d.price != null ? d.price : (it && it.price);
  let h = sale ? won(sale) : '';
  if(S.showCost && it && it.cost != null) h += `<span class="c">사입 ${won(it.cost)} · 수익 ${won((sale || 0) - it.cost)}</span>`;
  return h;
}
function renderRec(c){
  const shown = (c.drugs || []).filter(d => d.role !== '지명');
  const named = (c.drugs || []).filter(d => d.role === '지명');
  const base = shown.filter(d => d.role === '기본');
  const rows = (base.length ? '' :
      `<div class="drug"><span class="tier none">기본</span><div class="body">
        <div class="nm" style="color:var(--muted)">기본약이 비어 있습니다 — 관리자 화면에서 넣어 주세요</div></div><div class="pr"></div></div>`)
    + shown.map(d => {
      const it = S.byDrug[d.drug_id];
      const cls = d.role === '추가' ? ' add' : d.role === '대안' ? ' alt' : '';
      return `<div class="drug"><span class="tier${cls}">${esc(d.role)}</span>
        <div class="body">
          ${d.role === '대안' && d.alt_when ? `<div class="when">${esc(d.alt_when)}</div>` : ''}
          <div class="nm">${esc(d.name)}</div>
          ${d.reason ? `<div class="nt">${esc(d.reason)}</div>` : ''}
          ${it && it.short ? `<span class="sh">${esc(it.short)}</span>` : ''}</div>
        <div class="pr">${priceCell(d)}</div></div>`;
    }).join('');
  const namedRows = named.length
    ? `<div class="note" style="margin-top:10px">환자가 이름 대고 찾으면: `
      + named.map(d => esc(d.name) + (d.price ? ' ' + won(d.price) : '')).join(' · ') + `</div>`
    : '';
  $('recBody').innerHTML = rows + namedRows
    + (c.say ? `<div class="say">${esc(c.say)}</div>` : '')
    + (c.guide ? `<div class="guide">${esc(c.guide)}</div>` : '')
    + (S.sym.red ? `<div class="red">${esc(S.sym.red)}</div>` : '');
}

/* ── 약 목록 ── */
function hay(i){
  return [i.name, i.master, i.ing, i.eff, i.dis, i.sys, i.short, i.maker,
          ...(i.lines || []).map(l => l.sym + ' ' + l.case + ' ' + l.reason)].join(' ').toLowerCase();
}
function renderList(){
  let xs = S.items;
  if(S.dsys) xs = xs.filter(i => S.dsys === '__none' ? !i.sys : i.sys === S.dsys);
  if(S.dbrand) xs = xs.filter(i => i.brand === S.dbrand);
  const words = S.dq.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(words.length) xs = xs.filter(i => { const h = hay(i); return words.every(w => h.includes(w)); });
  const sorters = {
    name: (a,b) => a.name.localeCompare(b.name, 'ko'),
    price: (a,b) => (a.price == null ? 1e9 : a.price) - (b.price == null ? 1e9 : b.price),
    profit: (a,b) => ((b.price || 0) - (b.cost || 0)) - ((a.price || 0) - (a.cost || 0))
  };
  xs = [...xs].sort(sorters[S.dsort]);
  $('dcount').textContent = `${xs.length}개 품목`;
  $('dgrid').innerHTML = xs.map(cardHtml).join('') || '<div class="empty">조건에 맞는 약이 없습니다.</div>';
}
function cardHtml(i){
  const lines = (i.lines || []).slice(0, 4).map(l =>
    `<li><span class="p">${esc(l.role)}</span><span>${esc(l.sym)}${l.case ? ' · ' + esc(l.case) : ''}</span></li>`).join('');
  const pf = (i.price != null && i.cost != null) ? i.price - i.cost : null;
  return `<article class="card">
    <div class="n">${esc(i.name)}
      ${i.brand === 'O' ? '<span class="badge b-o">지명</span>' : i.brand === 'X' ? '<span class="badge b-x">상담</span>' : ''}</div>
    <div class="tags">${i.sys ? esc(i.sys) + (i.dis ? ' · ' + esc(i.dis) : '') : '미분류'}${i.status === 'pending' ? ' · 약국 전용' : ''}</div>
    ${lines ? `<ul>${lines}</ul>` : '<div class="tags" style="margin-top:6px">증상 없음</div>'}
    <div class="kv">${i.ing ? `<div><span>성분</span>${esc(i.ing)}</div>` : ''}${i.caution ? `<div><span>주의</span>${esc(i.caution)}</div>` : ''}</div>
    <div class="money">${i.price ? won(i.price) : '가격 미정'}
      ${S.showCost ? `<span class="cost">사입 ${i.cost != null ? won(i.cost) : '—'}${pf != null ? ' · 수익 ' + won(pf) : ''}</span>` : ''}</div>
  </article>`;
}

/* ── 이벤트 ── */
$('symChips').onclick = e => {
  if(e.target.id === 'chipMore'){ S.allSym = true; renderSymptoms(); return; }
  if(e.target.id === 'chipLess'){ S.allSym = false; renderSymptoms(); return; }
  const b = e.target.closest('[data-sym]'); if(!b) return;
  const s = S.symptoms.find(x => x.id === b.dataset.sym); if(s){ S.named = null; chooseSymptom(s); }
};
$('askBody').onclick = e => {
  const c = e.target.closest('[data-case]');
  if(c){ chooseCase(Number(c.dataset.case)); return; }
  const s = e.target.closest('[data-sym]');
  if(s){ const sym = S.symptoms.find(x => x.id === s.dataset.sym); if(sym) chooseSymptom(sym); }
};
$('btnFind').onclick = doFind;
$('q').onkeydown = e => { if(e.key === 'Enter') doFind(); };
$('dq').oninput = e => { S.dq = e.target.value; renderList(); };
$('dsys').onchange = e => { S.dsys = e.target.value; renderList(); };
$('dbrand').onchange = e => { S.dbrand = e.target.value; renderList(); };
$('dsort').onchange = e => { S.dsort = e.target.value; renderList(); };
$('btnCost').onclick = () => {
  S.showCost = !S.showCost;
  $('btnCost').textContent = S.showCost ? '원가 숨기기' : '원가';
  renderList(); if(S.kase) renderRec(S.kase);
};
$('btnReload').onclick = () => loadAll();
$('btnReset').onclick = () => {
  S.sym = null; S.kase = null; S.named = null; S.dq = ''; $('q').value = ''; $('dq').value = '';
  $('askBody').innerHTML = '<div class="empty">위에서 증상을 고르거나 환자 말을 입력하세요.</div>';
  $('recBody').innerHTML = '<div class="empty">경우를 고르면 약이 나옵니다.</div>';
  renderSymptoms(); renderList(); $('q').focus();
};
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if(e.key === '/'){ e.preventDefault(); $('q').focus(); $('q').select(); return; }
  if(/^[1-9]$/.test(e.key) && S.sym) chooseCase(Number(e.key) - 1);
});

/* ── 로그인 ── */
function show(w){ $('login').classList.toggle('hidden', w !== 'login'); $('app').classList.toggle('hidden', w !== 'app'); }
$('btnLogin').onclick = async () => {
  $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  if(error){ $('loginErr').textContent = '로그인 실패 — 이메일과 비밀번호를 확인하세요.'; return; }
  start();
};
$('pw').onkeydown = e => { if(e.key === 'Enter') $('btnLogin').click(); };
$('btnLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ show('login'); return; }
  show('app');
  const { data } = await sb.from('pharmacies').select('name').eq('id', session.user.id).maybeSingle();
  $('who').textContent = (data && data.name) || session.user.email;
  await loadAll();
  $('q').focus();
}
start();
</script>
